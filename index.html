<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAPACITY CRUNCHING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #121314;
    display: flex;
    justify-content: center;

                inset 0 0 60px rgba(0,0,0,0.6);
  }
  /* CSS size is set by fitCanvas() so the game fills the window; the backing
     store is sized separately by devicePixelRatio for crisp HiDPI rendering. */
  canvas { display: block; background: #202124; border-radius: 6px; width: 580px; height: 720px; }
  #scanlines {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;

<body>
<div id="screen">
  <canvas id="game" width="580" height="720"></canvas>
  <div id="scanlines"></div>
</div>
<script>
// ─── Dreamlo Leaderboard Configuration ───
// To connect to a live public Dreamlo leaderboard:
// 1. Visit http://dreamlo.com and generate your free Public and Private codes.
// 2. Paste them below. If left empty, a resilient local leaderboard (localStorage) is used!
const LEADERBOARD_CONFIG = {
  enabled: true,
  dreamloPublicCode: '',  // e.g. '66bc1234...'
  dreamloPrivateCode: '', // e.g. 'AbCdEfGhIjKl...'
};

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
// ─── Player settings (persisted in localStorage, edited on the OPTIONS screen) ───
const SETTINGS_KEY = 'cc_settings_v1';
const DISPLAY_OPTS = [ { label:'FIT WINDOW', scale:0 }, { label:'1X', scale:1 },
                       { label:'1.5X', scale:1.5 },     { label:'2X', scale:2 } ];
const TEXT_OPTS    = [ { label:'NORMAL', scale:1 }, { label:'LARGE', scale:1.2 }, { label:'X-LARGE', scale:1.4 } ];
const FONT_OPTS    = [ { label:'ARCADE' }, { label:'READABLE' } ];
const SOUND_OPTS   = [ { label:'ON' }, { label:'OFF' } ];
const OPTION_ROWS = [
  { key:'display', name:'DISPLAY SIZE', opts:DISPLAY_OPTS, hint:'SIZE OF THE WHOLE GAME. FIXED SIZES SHRINK TO FIT THE WINDOW.' },
  { key:'text',    name:'TEXT SIZE',    opts:TEXT_OPTS,    hint:'SCALES ALL TEXT. SHORTCUT: [ AND ] KEYS ON ANY SCREEN.' },
  { key:'font',    name:'FONT STYLE',   opts:FONT_OPTS,    hint:'READABLE SWAPS THE PIXEL FONTS FOR CLEARER ONES.' },
  { key:'sound',   name:'SOUND',        opts:SOUND_OPTS,   hint:'ARCADE SOUND EFFECTS.' },
];
const settings = { display:0, text:0, font:0, sound:0 };
function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
    for (const row of OPTION_ROWS) {
      const v = s[row.key];
      if (Number.isInteger(v) && v >= 0 && v < row.opts.length) settings[row.key] = v;
    }
  } catch(e) {}
}
function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch(e) {} }
function cycleSetting(key, dir) {
  const row = OPTION_ROWS.find(r => r.key === key);
  settings[key] = (settings[key] + dir + row.opts.length) % row.opts.length;
  saveSettings(); applyLayout();
}
function textScale() { return TEXT_OPTS[settings.text].scale; }
loadSettings();

// ─── Logical layout ───
// All drawing code works in a logical coordinate space CW x CH. The board is
// fixed; the sidebar (and therefore CW) widens with the text-size setting.
const CH = 720;
let CW = 580;
const COLS = 10, ROWS = 20, CELL = 28;
const BOARD_X = 20, BOARD_Y = 80;
const BOARD_W = COLS * CELL, BOARD_H = ROWS * CELL;
const SIDEBAR_X = BOARD_X + BOARD_W + 24;
const SIDEBAR_BASE_W = 236;
let SB_W = SIDEBAR_BASE_W;
function applyLayout() {
  SB_W = Math.round(SIDEBAR_BASE_W * textScale());
  CW = SIDEBAR_X + SB_W + 20;
}
applyLayout();

// ─── Display scaling ───
// fitCanvas() scales the logical space to the window (or to the chosen fixed
// display size, clamped to the window) and renders at native device
// resolution, so text stays sharp on HiDPI displays and under browser zoom.
const SCREEN_MARGIN = 48; // room for the bezel border + glow
let fitKey = '';
function fitCanvas() {
  const w = window.innerWidth, h = window.innerHeight, dpr = window.devicePixelRatio || 1;
  const want = DISPLAY_OPTS[settings.display].scale;
  const key = [w, h, dpr, CW, want].join(',');
  if (key === fitKey) return;
  fitKey = key;
  const fit = Math.min((w - SCREEN_MARGIN) / CW, (h - SCREEN_MARGIN) / CH);
  const scale = Math.max(0.3, want ? Math.min(want, fit) : fit);
  canvas.style.width  = Math.round(CW * scale) + 'px';
  canvas.style.height = Math.round(CH * scale) + 'px';
  canvas.width  = Math.round(CW * scale * dpr);
  canvas.height = Math.round(CH * scale * dpr);
  // Resizing resets context state, so the transform is applied after.
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
// Checked every frame (cheap: a few property reads) rather than via the resize
// event, which some embedded/emulated viewports do not dispatch reliably.
fitCanvas();

// ─── Fonts ───
// Every piece of text is one of three kinds. Each font style maps a kind to a
// family, a size multiplier (k, to equalise apparent size between families)
// and a line-height factor. Base sizes in the drawing code are the minimums:
// 12px for pixel/label text and 18px for body text.
const F_PIXEL = '"Press Start 2P", monospace';
const F_RETRO = '"VT323", monospace';
const F_SILK  = '"Silkscreen", monospace';
const F_MONO  = 'Consolas, Menlo, "DejaVu Sans Mono", monospace';
const FONT_MODES = [
  { // ARCADE
    pixel: { family:F_PIXEL, weight:'',    k:1,    lh:1.6  },
    label: { family:F_SILK,  weight:'700', k:1,    lh:1.5  },
    body:  { family:F_RETRO, weight:'',    k:1,    lh:1.1  },
  },
  { // READABLE
    pixel: { family:F_SILK,  weight:'700', k:1.05, lh:1.6  },
    label: { family:F_SILK,  weight:'700', k:1,    lh:1.5  },
    body:  { family:F_MONO,  weight:'',    k:0.8,  lh:1.35 },
  },
];
function fontSpec(kind) { return FONT_MODES[settings.font][kind]; }
function fontPx(kind, size) { return Math.round(size * fontSpec(kind).k * textScale()); }
function fontStr(kind, px) { const f = fontSpec(kind); return (f.weight ? f.weight + ' ' : '') + px + 'px ' + f.family; }
function lineH(kind, size) { return Math.round(fontPx(kind, size) * fontSpec(kind).lh); }

const G = { blue:'#4285F4', red:'#EA4335', yellow:'#FBBC04', green:'#34A853',
            bg:'#202124', surface:'#303134', text:'#E8EAED', dim:'#9AA0A6', border:'#5F6368' };
const GCOLORS = [G.blue, G.red, G.yellow, G.green];

const PIECES = [
  { name:'VM f1-micro',  color:'#4285F4', shape:[[1,1],[1,1]],         desc:'2 vCPU / 0.6GB',  pw:3  },
  { name:'VM n2-std-8',  color:'#34A853', shape:[[0,1,1],[1,1,0]],     desc:'8 vCPU / 32GB',   pw:5  },
  { name:'VM m2-ultra',  color:'#EA4335', shape:[[1,1,0],[0,1,1]],     desc:'416 vCPU / 12TB', pw:6  },
  { name:'GPU A3 Mega',  color:'#FBBC04', shape:[[1,1,1],[0,1,0]],     desc:'8x H100 / 80GB',  pw:10 },
  { name:'TPU v5p Pod',  color:'#7BAAF7', shape:[[1,1,1,1]],           desc:'8960 chips',       pw:14 },
  { name:'GKE Node',     color:'#1E8E3E', shape:[[1,0],[1,0],[1,1]],   desc:'e2-standard-4',    pw:7  },
  { name:'K8s Pod',      color:'#C5221F', shape:[[0,1],[0,1],[1,1]],   desc:'Container wkld',   pw:5  },
  { name:'Ctrl Plane',   color:'#E37400', shape:[[1,0],[1,1]],         desc:'k8s overhead!',    pw:12 },
];
const GARBAGE_COLOR = '#5F6368';
const GARBAGE_ID = 9;

// One region per level, in order. Level 1 starts in us-central1; every level-up
// migrates to the next region and inherits that region's legacy workload
// (its `cond` sets how much junk is on the racks). Levels past the end stay
// in GLOBAL.
const DATACENTERS = [
  { name:'us-central1',     cond:'clean' },
  { name:'us-east1',        cond:'moderate' },
  { name:'europe-west1',    cond:'clean' },
  { name:'asia-east1',      cond:'bad' },
  { name:'us-west1',        cond:'moderate' },
  { name:'europe-west4',    cond:'moderate' },
  { name:'asia-northeast1', cond:'terrible' },
  { name:'us-east5',        cond:'terrible' },
  { name:'australia-se1',   cond:'bad' },
  { name:'GLOBAL',          cond:'terrible' },
];
function regionFor(lvl) { return DATACENTERS[Math.min(lvl - 1, DATACENTERS.length - 1)]; }
function regionName() { return regionFor(level).name; }
const DC_LABELS = { clean:'CLEAN RACKS', moderate:'LEGACY WORKLOADS', bad:'BAD BIN-PACKING', terrible:'DISASTER ZONE' };
const DC_COLORS = { clean:G.green, moderate:G.blue, bad:G.yellow, terrible:G.red };
const LINE_PTS = [0, 100, 300, 500, 800];
const CLEAR_MSG = [null, ['OPTIMIZED!',G.green], ['AUTOSCALED!',G.blue],
                   ['REGION EXPANDED!',G.yellow], ['>>> GLOBAL DEPLOY <<<',G.red]];
const POWER_REDUCTION = [0, 15, 30, 50, 80];
const MAX_POWER = 100;

// ─── Audio ───
let audioCtx;
function initAudio() { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
function beep(freq, dur, type='square', vol=0.07) {
  if (!audioCtx || settings.sound === 1) return;
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
const SFX = {
  move:     () => beep(220, 0.03),
  rotate:   () => beep(330, 0.03),
  lock:     () => beep(110, 0.08, 'triangle'),
  drop:     () => beep(80, 0.12, 'triangle', 0.1),
  clear:    () => { beep(523,0.07); setTimeout(()=>beep(659,0.07),80); setTimeout(()=>beep(784,0.1),160); },
  tetris:   () => { beep(523,0.07); setTimeout(()=>beep(659,0.07),60); setTimeout(()=>beep(784,0.07),120); setTimeout(()=>beep(1047,0.15),180); },
  levelUp:  () => { for(let i=0;i<5;i++) setTimeout(()=>beep(440+i*110,0.07),i*60); },
  over:     () => { beep(400,0.15); setTimeout(()=>beep(300,0.15),150); setTimeout(()=>beep(200,0.25),300); },
  ctrl:     () => { beep(880,0.05); setTimeout(()=>beep(660,0.06),50); },
  throttle: () => { beep(150,0.2,'sawtooth',0.1); setTimeout(()=>beep(100,0.3,'sawtooth',0.08),150); },
  gigawatt: () => { for(let i=0;i<8;i++) setTimeout(()=>beep(300+i*120,0.06,'square',0.09),i*40); },
  powerWarn:() => beep(600, 0.04, 'square', 0.04),
  charSelect:() => beep(480, 0.04, 'triangle'),
  submit:   () => { beep(523,0.08); setTimeout(()=>beep(659,0.08),70); setTimeout(()=>beep(880,0.15),140); },
};

// ─── Utilities ───
function hexRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function rgbHex(r,g,b){return'#'+[r,g,b].map(c=>Math.max(0,Math.min(255,Math.round(c))).toString(16).padStart(2,'0')).join('');}
function lighten(h,a){const[r,g,b]=hexRgb(h);return rgbHex(r+a,g+a,b+a);}
function darken(h,a){const[r,g,b]=hexRgb(h);return rgbHex(r-a,g-a,b-a);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rotMat(m){const R=m.length,C=m[0].length,o=[];for(let j=0;j<C;j++){o[j]=[];for(let i=R-1;i>=0;i--)o[j][R-1-i]=m[i][j];}return o;}

// ─── Leaderboard Engine (Dreamlo + LocalStorage) ───
const DEFAULT_SCORES = [
  { name:'GKE', score:24500, region:'GLOBAL' },
  { name:'SRE', score:19800, region:'us-central1' },
  { name:'K8S', score:15200, region:'europe-west1' },
  { name:'TPU', score:11400, region:'asia-east1' },
  { name:'BOR', score:8600,  region:'us-west1' },
  { name:'VMM', score:6200,  region:'us-east1' },
  { name:'POD', score:4300,  region:'europe-west4' },
  { name:'NET', score:2800,  region:'australia-se1' },
  { name:'OPS', score:1500,  region:'asia-northeast1' },
  { name:'DEV', score:800,   region:'us-east5' },
];

let leaderboardData = [];
let leaderboardLoading = false;
let leaderboardStatus = '';

function getLocalLeaderboard() {
  try {
    const raw = localStorage.getItem('cc_leaderboard_v2');
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return [...DEFAULT_SCORES];
}

function saveLocalLeaderboard(list) {
  try {
    localStorage.setItem('cc_leaderboard_v2', JSON.stringify(list.slice(0, 10)));
  } catch(e) {}
}

async function loadLeaderboard() {
  leaderboardLoading = true;
  leaderboardStatus = 'FETCHING TELEMETRY...';
  const localList = getLocalLeaderboard();
  leaderboardData = localList;

  if (LEADERBOARD_CONFIG.enabled && LEADERBOARD_CONFIG.dreamloPublicCode) {
    try {
      const url = `https://www.dreamlo.com/lb/${LEADERBOARD_CONFIG.dreamloPublicCode}/json/10`;
      const res = await fetch(url);
      if (res.ok) {
        const data = await res.json();
        if (data && data.dreamlo && data.dreamlo.leaderboard) {
          let entries = data.dreamlo.leaderboard.entry;
          if (entries) {
            if (!Array.isArray(entries)) entries = [entries];
            leaderboardData = entries.map(e => ({
              name: (e.name || '???').toUpperCase().slice(0, 3),
              score: parseInt(e.score) || 0,
              region: e.text || 'us-central1'
            }));
            leaderboardStatus = 'GLOBAL CLOUD SYNCED';
            leaderboardLoading = false;
            return;
          }
        }
      }
    } catch(err) {
      console.warn('Dreamlo fetch error, fallback to local', err);
    }
  }

  leaderboardStatus = 'LOCAL CLOUD ARCHIVE';
  leaderboardLoading = false;
}

async function recordScore(name, scoreNum, regionStr) {
  const cleanName = (name || 'AAA').toUpperCase().slice(0, 3);
  const cleanRegion = regionStr || 'us-central1';
  
  // Update local
  let list = getLocalLeaderboard();
  list.push({ name: cleanName, score: scoreNum, region: cleanRegion });
  list.sort((a,b) => b.score - a.score);
  list = list.slice(0, 10);
  saveLocalLeaderboard(list);
  leaderboardData = list;

  // Submit to Dreamlo if configured
  if (LEADERBOARD_CONFIG.enabled && LEADERBOARD_CONFIG.dreamloPrivateCode) {
    try {
      const url = `https://www.dreamlo.com/lb/${LEADERBOARD_CONFIG.dreamloPrivateCode}/add/${encodeURIComponent(cleanName)}/${scoreNum}/0/${encodeURIComponent(cleanRegion)}`;
      await fetch(url);
    } catch(e) {
      console.warn('Failed to post to Dreamlo', e);
    }
  }
}

// ─── State ───
const ST = { MENU:0, PLAY:1, PAUSE:2, OVER:3, LEADERBOARD:4, NAME_ENTRY:5, OPTIONS:6 };
let state = ST.MENU;
let prevState = ST.MENU;
let board, piece, nextType, holdType, canHold, bag, score, highScore, lines, level;
let dropTimer, lockTimer, clearRows, clearTimer, forceCtrl;
let particles, msg, msgTimer, msgColor, frame;
let power, peakPower, shakeTimer, shakeX, shakeY, flashTimer, flashColor;
let gigawattPending, ctrlPlaneRows;

// Name Entry State
const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!?_";
let nameChars = ['A', 'A', 'A'];
let nameCursor = 0;

highScore = parseInt(localStorage.getItem('ccHS') || '0');
const initialLocal = getLocalLeaderboard();
if (initialLocal.length > 0 && initialLocal[0].score > highScore) {
  highScore = initialLocal[0].score;
}

function resetState() {
  board = Array.from({length:ROWS}, ()=>new Array(COLS).fill(0));
  score=0; lines=0; level=1; holdType=-1; canHold=true; forceCtrl=false;
  particles=[]; msg=''; msgTimer=0; dropTimer=0; lockTimer=0;
  clearRows=[]; clearTimer=0; bag=[]; power=0;
  peakPower=0; shakeTimer=0; shakeX=0; shakeY=0; flashTimer=0; flashColor='#FFF';
  gigawattPending=false; ctrlPlaneRows=0;
  const dc = regionFor(level);
  generateInheritedWorkload(dc.cond, true);
  fillBag(); nextType=pullBag(); spawnNext();
  showMsg(dc.name + ': ' + DC_LABELS[dc.cond], DC_COLORS[dc.cond], 120);
}

// ─── Piece bag ───
function fillBag() { bag = shuffle([0,1,2,3,4,5,6]); }
function pullBag() {
  if (forceCtrl) { forceCtrl = false; return 7; }
  if (!bag.length) fillBag();
  return bag.pop();
}
function mkPiece(t) {
  const d = PIECES[t], s = d.shape.map(r=>[...r]);
  return { type:t, shape:s, x:Math.floor((COLS-s[0].length)/2), y:0, color:d.color };
}
function spawnNext() {
  piece = mkPiece(nextType);
  nextType = pullBag();
  canHold = true; dropTimer = 0; lockTimer = 0;
  if (piece.type === 7) { showMsg('CTRL PLANE DEPLOYING!', '#E37400', 90); SFX.ctrl(); }
  if (!isValid(piece.shape, piece.x, piece.y)) gameOver();
}

// ─── Board ops ───
function isValid(s, px, py) {
  for (let y=0; y<s.length; y++) for (let x=0; x<s[y].length; x++)
    if (s[y][x]) { const bx=px+x, by=py+y;
      if (bx<0||bx>=COLS||by>=ROWS) return false;
      if (by>=0 && board[by][bx]) return false; }
  return true;
}
function getGhostY() { let gy=piece.y; while(isValid(piece.shape,piece.x,gy+1)) gy++; return gy; }

// ─── Power system ───
function addPower(amount) {
  power = Math.min(MAX_POWER, power + amount);
  peakPower = Math.max(peakPower, power);
  if (power >= MAX_POWER) thermalThrottle();
}
function reducePower(amount) { power = Math.max(0, power - amount); }

function thermalThrottle() {
  showMsg('⚠ THERMAL THROTTLE! ⚠', G.red, 120);
  SFX.throttle();
  startShake(15);
  startFlash('#EA4335', 10);
  addGarbageRow();
  power = 45;
}

function addGarbageRow() {
  if (board[0].some(c => c !== 0)) { gameOver(); return; }
  board.shift();
  const row = new Array(COLS).fill(GARBAGE_ID);
  const gaps = 2 + Math.floor(Math.random() * 2);
  const positions = shuffle([...Array(COLS).keys()]).slice(0, gaps);
  positions.forEach(i => { row[i] = 0; });
  board.push(row);
  if (piece && !isValid(piece.shape, piece.x, piece.y)) {
    piece.y--;
    if (piece.y < 0 || !isValid(piece.shape, piece.x, piece.y)) gameOver();
  }
}

function triggerGigawatt() {
  showMsg('⚡ GIGAWATT SURGE! ⚡', '#FFD700', 120);
  SFX.gigawatt();
  startShake(12);
  startFlash('#FBBC04', 15);
  power = 0;
  let bestRow = -1, bestFill = 0;
  for (let y = ROWS-1; y >= 0; y--) {
    if (clearRows.includes(y)) continue;
    const fill = board[y].filter(c => c !== 0).length;
    if (fill > bestFill) { bestFill = fill; bestRow = y; }
  }
  if (bestRow >= 0 && bestFill >= 3) {
    clearRows.push(bestRow);
    spawnParticles(bestRow);
    score += 200 * level;
  }
}

function generateInheritedWorkload(cond, isStart) {
  const cfgs = {
    clean:    { rows:[0,1], fill:[0.1,0.2] },
    moderate: { rows:[1,2], fill:[0.2,0.4] },
    bad:      { rows:[2,4], fill:[0.35,0.55] },
    terrible: { rows:[3,6], fill:[0.5,0.75] },
  };
  const cfg = cfgs[cond];
  let numRows = cfg.rows[0] + Math.floor(Math.random() * (cfg.rows[1] - cfg.rows[0] + 1));
  if (!isStart) numRows = Math.min(numRows, 3);
  for (let i = 0; i < numRows; i++) {
    if (board[0].some(c => c !== 0)) break;
    board.shift();
    const row = new Array(COLS).fill(0);
    const fp = cfg.fill[0] + Math.random() * (cfg.fill[1] - cfg.fill[0]);
    for (let c = 0; c < COLS; c++) {
      if (Math.random() < fp) {
        const t = Math.floor(Math.random() * 7) + 1;
        row[c] = t;
        if (c + 1 < COLS && Math.random() < 0.4) { row[++c] = t; }
      }
    }
    if (row.filter(c => c !== 0).length >= COLS - 1) {
      const idxs = shuffle([...Array(COLS).keys()]);
      row[idxs[0]] = 0; row[idxs[1]] = 0;
    }
    board.push(row);
  }
}

// ─── Movement ───
function movePiece(dx, dy) {
  if (!piece) return false;
  if (isValid(piece.shape, piece.x+dx, piece.y+dy)) {
    piece.x += dx; piece.y += dy;
    if (dx !== 0) { SFX.move(); if (!isValid(piece.shape,piece.x,piece.y+1)) lockTimer=30; }
    return true;
  }
  return false;
}
function rotatePiece() {
  if (!piece || piece.type===0) return;
  const r = rotMat(piece.shape);
  for (const [dx,dy] of [[0,0],[-1,0],[1,0],[0,-1],[-2,0],[2,0],[0,-2]]) {
    if (isValid(r, piece.x+dx, piece.y+dy)) {
      piece.shape=r; piece.x+=dx; piece.y+=dy; SFX.rotate();
      if (!isValid(piece.shape,piece.x,piece.y+1)) lockTimer=30;
      return;
    }
  }
}
function hardDrop() {
  if (!piece) return;
  let d=0; while(movePiece(0,1)) d++;
  score += d*2; SFX.drop(); lockPiece();
}
function softDrop() { if (movePiece(0,1)) { score+=1; dropTimer=0; } }

// ─── Lock & Clear ───
function lockPiece() {
  if (!piece) return;
  const s = piece.shape;
  const lockedType = piece.type;
  for (let y=0; y<s.length; y++) for (let x=0; x<s[y].length; x++)
    if (s[y][x]) { const by=piece.y+y, bx=piece.x+x;
      if (by<0) { gameOver(); return; }
      board[by][bx] = lockedType+1; }
  SFX.lock();
  addPower(PIECES[lockedType].pw);
  if (lockedType === 5) forceCtrl = true;
  if (lockedType === 7) {
    startFlash('#E37400', 8);
    startShake(6);
  }
  clearRows = [];
  ctrlPlaneRows = 0;
  for (let y=0; y<ROWS; y++) if (board[y].every(c=>c)) {
    clearRows.push(y);
    if (board[y].some(c => c === 8)) ctrlPlaneRows++;
  }
  if (clearRows.length) {
    const n = clearRows.length;
    if (n >= 3 || (n >= 2 && Math.random() < 0.4)) gigawattPending = true;
    else gigawattPending = false;
    clearTimer = 22;
    clearRows.forEach(y => spawnParticles(y));
    if (n >= 4) SFX.tetris(); else SFX.clear();
    reducePower(POWER_REDUCTION[Math.min(n, 4)]);
  } else { spawnNext(); }
}

function finishClear() {
  if (gigawattPending) { gigawattPending = false; triggerGigawatt(); }
  const n = clearRows.length;
  for (const y of [...clearRows].sort((a,b)=>b-a)) { board.splice(y,1); board.unshift(new Array(COLS).fill(0)); }
  let pts = LINE_PTS[Math.min(n, 4)] * level;
  if (ctrlPlaneRows > 0) {
    pts += 200 * ctrlPlaneRows * level;
    showMsg('OVERHEAD ELIMINATED! +' + (200*ctrlPlaneRows*level), '#E37400', 100);
  } else {
    const cm=CLEAR_MSG[Math.min(n,4)]; if(cm) showMsg(cm[0],cm[1]);
  }
  score += pts;
  lines += n;
  const nl = Math.floor(lines/10)+1;
  if (nl > level) {
    level = nl; SFX.levelUp();
    // Migrate to the next region and inherit its legacy workload (capped at
    // 3 rows mid-game so a level-up is a challenge, not a death sentence).
    const dc = regionFor(level);
    generateInheritedWorkload(dc.cond, false);
    showMsg('LEVEL ' + level + ': ' + dc.name, DC_COLORS[dc.cond], 120);
  }
  clearRows = []; spawnNext();
}

function doHold() {
  if (!piece || !canHold) return;
  canHold = false;
  if (holdType === -1) { holdType=piece.type; spawnNext(); }
  else { const t=holdType; holdType=piece.type; piece=mkPiece(t); }
}

function gameOver() {
  state = ST.OVER; SFX.over();
  if (score > highScore) { highScore=score; localStorage.setItem('ccHS', String(highScore)); }
}
function startGame() { state=ST.PLAY; if(!audioCtx)initAudio(); resetState(); }

// ─── Effects ───

function spawnParticles(row) {

    particles.push({ x:BOARD_X+x*CELL+Math.random()*CELL, y:BOARD_Y+row*CELL+Math.random()*CELL,

      color:GCOLORS[Math.floor(Math.random()*4)], life:30+Math.random()*25, size:2+Math.random()*5 });
}

    particles.push({ x:BOARD_X+Math.random()*BOARD_W, y:BOARD_Y+BOARD_H,

}

function showMsg(t,c='#FFF',d=90) { msg=t; msgColor=c; msgTimer=d; }

// ─── Cell drawing with chip patterns ───
function drawCell(px, py, color, cellType, ghost) {
  if (ghost) {
    ctx.strokeStyle=color; ctx.globalAlpha=0.3; ctx.lineWidth=2;
    ctx.strokeRect(px+2,py+2,CELL-4,CELL-4); ctx.globalAlpha=1; ctx.lineWidth=1;
    return;
  }
  // Base fill
  ctx.fillStyle=color; ctx.fillRect(px,py,CELL,CELL);
  // 3D edges
  ctx.fillStyle=lighten(color,50); ctx.fillRect(px,py,CELL,2); ctx.fillRect(px,py,2,CELL);
  ctx.fillStyle=darken(color,60); ctx.fillRect(px,py+CELL-2,CELL,2); ctx.fillRect(px+CELL-2,py,2,CELL);

  // Chip-specific internal patterns
  const dc = darken(color, 25);
  const lc = lighten(color, 30);
  ctx.fillStyle = dc;

  if (cellType >= 1 && cellType <= 3) {
    for (let i=0;i<4;i++) ctx.fillRect(px+4+i*6, py+1, 3, 3);
    for (let i=0;i<4;i++) ctx.fillRect(px+4+i*6, py+CELL-4, 3, 3);
    for (let i=0;i<3;i++) ctx.fillRect(px+1, py+5+i*8, 3, 2);
    for (let i=0;i<3;i++) ctx.fillRect(px+CELL-4, py+5+i*8, 3, 2);
    ctx.fillStyle = lighten(color, 15);
    ctx.fillRect(px+7, py+7, CELL-14, CELL-14);
    ctx.fillStyle = lc;
    ctx.fillRect(px+9, py+9, 3, 3);
  }
  else if (cellType === 4) {
    ctx.fillStyle = lighten(color, 20);
    for (let i=0;i<5;i++) ctx.fillRect(px+4, py+4+i*5, CELL-8, 2);
    ctx.fillStyle = dc;
    ctx.fillRect(px+6, py+3, 2, CELL-6);
    ctx.fillRect(px+CELL-8, py+3, 2, CELL-6);
  }
  else if (cellType === 5) {
    ctx.fillStyle = lighten(color, 35);
    for (let r=0;r<4;r++) for (let c=0;c<4;c++) ctx.fillRect(px+4+c*6, py+4+r*6, 3, 3);
    ctx.fillStyle = dc;
    ctx.fillRect(px+3, py+3, CELL-6, 1);
    ctx.fillRect(px+3, py+CELL-4, CELL-6, 1);
    ctx.fillRect(px+3, py+3, 1, CELL-6);
    ctx.fillRect(px+CELL-4, py+3, 1, CELL-6);
  }
  else if (cellType === 6) {
    ctx.fillStyle = lc;
    ctx.fillRect(px+12, py+5, 4, 4);
    ctx.fillRect(px+10, py+9, 8, 4);
    ctx.fillRect(px+8, py+13, 12, 4);
    ctx.fillRect(px+10, py+17, 8, 4);
    ctx.fillRect(px+12, py+21, 4, 3);
    ctx.fillStyle = dc;
    ctx.fillRect(px+13, py+3, 2, 22);
    ctx.fillRect(px+5, py+13, 18, 2);
  }
  else if (cellType === 7) {
    ctx.fillStyle = lc;
    for (let i=0;i<4;i++) ctx.fillRect(px+4+i*6, py+4, 4, 2);
    for (let i=0;i<4;i++) ctx.fillRect(px+4+i*6, py+CELL-6, 4, 2);
    for (let i=0;i<3;i++) ctx.fillRect(px+4, py+6+i*7, 2, 4);
    for (let i=0;i<3;i++) ctx.fillRect(px+CELL-6, py+6+i*7, 2, 4);
    ctx.fillRect(px+12, py+12, 4, 4);
  }
  else if (cellType === 8) {
    ctx.fillStyle = darken(color, 15);
    ctx.fillRect(px+4, py+8, 10, 2);
    ctx.fillRect(px+12, py+8, 2, 8);
    ctx.fillRect(px+12, py+14, 10, 2);
    ctx.fillRect(px+4, py+18, 2, 6);
    ctx.fillRect(px+18, py+4, 2, 12);
    ctx.fillStyle = lighten(color, 40);
    ctx.fillRect(px+4, py+4, 6, 2);
    ctx.fillRect(px+20, py+CELL-6, 4, 2);
  }
  else if (cellType === GARBAGE_ID) {
    ctx.fillStyle = darken(GARBAGE_COLOR, 20);
    for (let i=0;i<CELL-4;i+=4) {
      ctx.fillRect(px+2+i, py+2+i, 3, 3);
      ctx.fillRect(px+CELL-5-i, py+2+i, 3, 3);
    }
    ctx.fillStyle = '#EA4335';
    ctx.fillRect(px+2, py+2, CELL-4, 1);
    ctx.fillRect(px+2, py+CELL-3, CELL-4, 1);
  }
}

function drawBoard() {
  ctx.fillStyle='#16162A'; ctx.fillRect(BOARD_X,BOARD_Y,BOARD_W,BOARD_H);
  ctx.strokeStyle='#22223A'; ctx.lineWidth=1;
  for (let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(BOARD_X+x*CELL,BOARD_Y);ctx.lineTo(BOARD_X+x*CELL,BOARD_Y+BOARD_H);ctx.stroke();}
  for (let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(BOARD_X,BOARD_Y+y*CELL);ctx.lineTo(BOARD_X+BOARD_W,BOARD_Y+y*CELL);ctx.stroke();}
  for (let y=0;y<ROWS;y++) for (let x=0;x<COLS;x++) {
    const v = board[y][x];
    if (v) {
      const color = v === GARBAGE_ID ? GARBAGE_COLOR : PIECES[v-1].color;
      drawCell(BOARD_X+x*CELL, BOARD_Y+y*CELL, color, v);
    }
  }
  if (clearTimer > 0) {
    const fl=Math.floor(clearTimer/3)%2===0;
    clearRows.forEach(y=>{
      ctx.fillStyle=fl?'#FFFFFF':'#E8EAED';
      ctx.fillRect(BOARD_X,BOARD_Y+y*CELL,BOARD_W,CELL);
    });
  }
  const borderColor = power > 80 ? G.red : power > 55 ? G.yellow : G.border;
  ctx.strokeStyle=borderColor; ctx.lineWidth=2;
  ctx.strokeRect(BOARD_X-1,BOARD_Y-1,BOARD_W+2,BOARD_H+2);
  if (power > 70) {
    const pulse = 0.15 + 0.15 * Math.sin(frame * 0.15);
    ctx.globalAlpha = pulse;
    ctx.strokeStyle = G.red;
    ctx.lineWidth = 4;
    ctx.strokeRect(BOARD_X-3,BOARD_Y-3,BOARD_W+6,BOARD_H+6);
    ctx.globalAlpha = 1;
  }
  ctx.lineWidth=1;
}

function drawPiece() {
  if (!piece || clearTimer>0) return;
  const gy = getGhostY();
  if (gy !== piece.y) {
    for (let y=0;y<piece.shape.length;y++) for (let x=0;x<piece.shape[y].length;x++)
      if (piece.shape[y][x] && gy+y>=0)
        drawCell(BOARD_X+(piece.x+x)*CELL, BOARD_Y+(gy+y)*CELL, piece.color, piece.type+1, true);
  }
  for (let y=0;y<piece.shape.length;y++) for (let x=0;x<piece.shape[y].length;x++)
    if (piece.shape[y][x] && piece.y+y>=0)
      drawCell(BOARD_X+(piece.x+x)*CELL, BOARD_Y+(piece.y+y)*CELL, piece.color, piece.type+1);
}

// ─── Text rendering ───
// text() is the only place fillText is called. It applies the font style and
// text-size settings, and if `max` is given it shrinks the font (to 75%) and
// then condenses the glyphs so the string always fits.
function text(str, x, y, o = {}) {
  const kind = o.kind || 'pixel', size = o.size || 12;
  let px = fontPx(kind, size);
  ctx.font = fontStr(kind, px);
  let w = o.max ? ctx.measureText(str).width : 0;
  const minPx = Math.ceil(px * 0.75);
  while (o.max && w > o.max && px > minPx) { px--; ctx.font = fontStr(kind, px); w = ctx.measureText(str).width; }
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.baseline || 'top';
  const paint = (color, d) => {
    ctx.fillStyle = color;
    if (o.max && w > o.max) ctx.fillText(str, x + d, y + d, o.max); else ctx.fillText(str, x + d, y + d);
  };
  if (o.shadow) paint('#000', o.shadow);
  paint(o.color || G.text, 0);
}

// ─── Flow layout ───
// Screens are built as a vertical flow of lines, gaps and custom boxes so
// their spacing follows the current font sizes instead of hand-placed y
// values. renderFlow() measures the flow first, drops optional sections
// (highest level first) if it does not fit, compresses gaps if it still does
// not fit, then draws it.
class Flow {
  constructor(x, y, o = {}) {
    this.x = x; this.y = y; this.top = y;
    this.align = o.align || 'left'; this.max = o.max || 0;
    this.dry = !!o.dry; this.gapScale = o.gapScale == null ? 1 : o.gapScale;
    this.level = o.level == null ? 99 : o.level;
    this.gaps = 0; this.used = 0;
  }
  get h() { return this.y - this.top; }
  line(str, o = {}) {
    const kind = o.kind || 'pixel', size = o.size || 12;
    if (!this.dry) text(str, this.x + (o.dx || 0), this.y, Object.assign({ align:this.align, max:this.max }, o));
    this.y += lineH(kind, size);
    return this.gap(o.gap || 0);
  }
  gap(n) { this.y += Math.round(n * this.gapScale); this.gaps += n; return this; }
  box(h, fn) { if (!this.dry) fn(this.x, this.y, h); this.y += h; return this; }
  optional(level, fn) { if (level <= this.level) { this.used = Math.max(this.used, level); fn(this); } return this; }
}
function renderFlow(build, o) {
  const avail = o.bottom - o.top;
  let level = 99, fl;
  for (;;) {
    fl = new Flow(o.x, o.top, { align:o.align, max:o.max, dry:true, level });
    build(fl);
    if (fl.h <= avail || fl.used === 0) break;
    level = fl.used - 1;
  }
  let gapScale = 1, h = fl.h;
  if (h > avail && fl.gaps > 0) {
    gapScale = Math.max(0.15, Math.min(1, (avail - (h - fl.gaps)) / fl.gaps));
    h = h - fl.gaps + Math.round(fl.gaps * gapScale);
  }
  const y0 = o.center ? o.top + Math.max(0, Math.round((avail - h) / 2)) : o.top;
  const out = new Flow(o.x, y0, { align:o.align, max:o.max, level, gapScale });
  build(out);
  return out; // out.used = highest optional level that was drawn
}
const blink = () => Math.floor(frame / 30) % 2 === 0;

// ─── Sidebar ───
function drawPreviewShape(type, x, y, w, h) {
  const d = PIECES[type], s = d.shape, bw = s[0].length * 14, bh = s.length * 14;
  const ox = x + Math.floor((w - bw) / 2), oy = y + Math.floor((h - bh) / 2);
  for (let r=0;r<s.length;r++) for (let c=0;c<s[r].length;c++) if(s[r][c]) {
    const cpx=ox+c*14, cpy=oy+r*14;
    ctx.fillStyle=d.color; ctx.fillRect(cpx,cpy,13,13);
    ctx.fillStyle=lighten(d.color,40); ctx.fillRect(cpx,cpy,13,2); ctx.fillRect(cpx,cpy,2,13);
    ctx.fillStyle=darken(d.color,50); ctx.fillRect(cpx,cpy+11,13,2); ctx.fillRect(cpx+11,cpy,2,13);
    if (type<=2) { ctx.fillStyle=darken(d.color,20); ctx.fillRect(cpx+4,cpy+4,5,5); }
    else if (type===3) { ctx.fillStyle=lighten(d.color,25); for(let i=0;i<3;i++) ctx.fillRect(cpx+3,cpy+3+i*3,7,1); }
    else if (type===4) { ctx.fillStyle=lighten(d.color,30); for(let r2=0;r2<3;r2++) for(let c2=0;c2<3;c2++) ctx.fillRect(cpx+2+c2*3,cpy+2+r2*3,2,2); }
    else if (type===5) { ctx.fillStyle=lighten(d.color,25); ctx.fillRect(cpx+5,cpy+3,3,7); ctx.fillRect(cpx+3,cpy+5,7,3); }
    else if (type===6) { ctx.fillStyle=lighten(d.color,25); for(let i=0;i<3;i++) ctx.fillRect(cpx+3+i*3,cpy+3,2,1); for(let i=0;i<3;i++) ctx.fillRect(cpx+3+i*3,cpy+9,2,1); }
    else if (type===7) { ctx.fillStyle=darken(d.color,15); ctx.fillRect(cpx+3,cpy+5,7,1); ctx.fillRect(cpx+5,cpy+3,1,7); }
  }
}
function previewSection(fl, type, label) {
  fl.line(label, { kind:'label', size:12, color:G.dim });
  fl.box(46, (x, y, h) => {
    if (type < 0) { text('[ EMPTY ]', x + 42, y + h / 2, { kind:'body', size:18, color:'#4A4A5A', align:'center', baseline:'middle' }); return; }
    drawPreviewShape(type, x, y, 84, h);
  });
  const d = type >= 0 ? PIECES[type] : null;
  fl.line(!d ? '' : type === 7 ? d.name + '  ! OVERHEAD' : d.name, { kind:'body', size:18, color: d ? d.color : G.dim, gap:6 });
}

function drawPowerBar() {
  const bh = Math.max(16, fontPx('label', 12) + 6);
  const bx = BOARD_X, by = BOARD_Y - bh - 6, bw = BOARD_W;

  ctx.fillStyle = '#303134'; ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = col; ctx.fillRect(bx, by, bw * pct, bh);
  ctx.fillStyle = 'rgba(234,67,53,0.3)'; ctx.fillRect(bx + bw * 0.8, by, bw * 0.2, bh);
  ctx.fillStyle = '#202124'; for (let i = 1; i < 10; i++) ctx.fillRect(bx + i * (bw / 10), by, 1, bh);
  ctx.strokeStyle = pct > 0.8 ? G.red : '#5F6368'; ctx.lineWidth = 1; ctx.strokeRect(bx, by, bw, bh);

  text('POWER RACK', bx + 6, ty, { kind:'label', size:12, color:'#FFF', baseline:'middle', shadow:1, max:bw * 0.4 });

}

  }
}

function drawParticles() {
  particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/40);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size);});

}

function drawMsg() {
  if (msgTimer <= 0) return;
  ctx.save();
  ctx.globalAlpha = Math.min(1, msgTimer / 20);
  const h = Math.max(48, fontPx('pixel', 12) * 3), cy = BOARD_Y + BOARD_H / 2;
  ctx.fillStyle = 'rgba(10,12,16,0.85)'; ctx.fillRect(BOARD_X, cy - h / 2, BOARD_W, h);
  ctx.strokeStyle = msgColor; ctx.lineWidth = 2; ctx.strokeRect(BOARD_X, cy - h / 2, BOARD_W, h);
  text(msg, BOARD_X + BOARD_W / 2, cy, { size:12, color:msgColor, align:'center', baseline:'middle', max:BOARD_W - 16 });
  ctx.restore();
}

function drawHeader() {
  text('CAPACITY', BOARD_X, 14, { size:14, color:G.blue });
  const w = ctx.measureText('CAPACITY ').width;
  text('CRUNCHING', BOARD_X + w, 14, { size:14, color:G.red });
}

function drawFlash() {
  if (flashTimer <= 0) return;
  ctx.globalAlpha = flashTimer / 20;
  ctx.fillStyle = flashColor;
  ctx.fillRect(0, 0, CW, CH);
  ctx.globalAlpha = 1;
}

// ─── Screens ───
function drawTitle() {
  ctx.fillStyle=G.bg; ctx.fillRect(0,0,CW,CH);
  for (let i=0;i<30;i++) {
    const bx=((i*67+frame*0.2)%(CW+60))-30;
    const by=((i*43+80)%(CH-100))+50;
    ctx.globalAlpha=0.12; const c=GCOLORS[i%4]; const sz=14+i%3*8;
    ctx.fillStyle=c; ctx.fillRect(bx,by,sz,sz);
    ctx.fillStyle=lighten(c,40); ctx.fillRect(bx,by,sz,2); ctx.fillRect(bx,by,2,sz);
    ctx.fillStyle=darken(c,40); ctx.fillRect(bx+sz-2,by,2,sz); ctx.fillRect(bx,by+sz-2,sz,2);
  }
  ctx.globalAlpha=1;
  const cx = CW / 2;
  renderFlow(fl => {
    fl.line('CAPACITY',  { size:26, color:G.blue, shadow:3 });
    fl.line('CRUNCHING', { size:26, color:G.red,  shadow:3, gap:6 });
    fl.line('STACK • OPTIMIZE • DEPLOY • SCALE', { kind:'body', size:20, color:G.text, gap:4 });
    fl.box(4, (x, y) => { GCOLORS.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(x - 120 + i * 60, y, 60, 4); }); });
    fl.gap(22);

    const showcase = [[0,'VM f1',G.blue],[3,'GPU A3',G.yellow],[4,'TPU v5p','#7BAAF7'],[5,'GKE Node',G.green]];
    const lh = lineH('body', 18);
    fl.box(lh + 4 + 36, (x, y) => {
      showcase.forEach(([t, label, c], i) => {
        const ox = x - 180 + i * 95;
        text(label, ox + 18, y, { kind:'body', size:18, color:c, align:'center', max:90 });
        const s = PIECES[t].shape, col = PIECES[t].color;
        for (let r=0;r<s.length;r++) for (let cc=0;cc<s[r].length;cc++) if (s[r][cc]) {
          const px=ox+cc*12, py=y+lh+4+r*12;
          ctx.fillStyle=col; ctx.fillRect(px,py,11,11);
          ctx.fillStyle=lighten(col,35); ctx.fillRect(px,py,11,1); ctx.fillRect(px,py,1,11);
          ctx.fillStyle=darken(col,35); ctx.fillRect(px,py+10,11,1); ctx.fillRect(px+10,py,1,11);
        }
      });
    });
    fl.gap(18);

    const feat = { kind:'body', size:18, gap:2 };
    fl.line('⚡ POWER SYSTEM: EACH CHIP COSTS WATTS',          Object.assign({ color:'#FFD700' }, feat));
    fl.line('⚠ 100W = THERMAL THROTTLE (GARBAGE ROWS)',        Object.assign({ color:G.red }, feat));
    fl.line('⚡ 3+ LINE CLEARS TRIGGER GIGAWATT SURGE',         Object.assign({ color:G.yellow }, feat));
    fl.line('☸ GKE NODES FORCE CONTROL PLANE DEPLOYMENT',      Object.assign({ color:G.green }, feat));
    fl.line('🎯 CLEAR CONTROL PLANES FOR MASSIVE BONUS POINTS', Object.assign({ color:'#E8EAED' }, feat));
    fl.gap(24);

    fl.line(blink() ? 'PRESS ENTER TO DEPLOY' : '', { size:14, color:G.yellow, gap:10 });
    fl.line('[L] LEADERBOARD    [O] OPTIONS', { size:12, color:G.blue, gap:26 });
    fl.line('←→ MOVE   ↑ ROTATE   ↓ SOFT DROP   SPACE DROP   C HOLD', { kind:'body', size:18, color:G.dim, gap:24 });
    fl.line(highScore > 0 ? '★ ALL-TIME HIGH SCORE: ' + highScore + ' ★' : '', { kind:'body', size:18, color:G.yellow });
  }, { x:cx, top:50, bottom:CH - 40, align:'center', max:CW - 40, center:true });
}

function drawPause() {
  ctx.fillStyle='rgba(20,21,24,0.92)'; ctx.fillRect(0,0,CW,CH);
  renderFlow(fl => {
    fl.line('SYSTEM PAUSED', { size:22, color:G.yellow, gap:24 });
    const o = { kind:'body', size:18, color:G.text, gap:8 };
    fl.line('PRESS [P] TO RESUME OPERATION', o);
    fl.line('PRESS [L] TO VIEW LEADERBOARD', o);
    fl.line('PRESS [O] FOR OPTIONS', o);
    fl.line('PRESS [Q] TO RETURN TO TITLE', o);
  }, { x:CW / 2, top:180, bottom:CH - 120, align:'center', max:CW - 40, center:true });
}

function drawOver() {
  ctx.fillStyle='rgba(20,21,24,0.94)'; ctx.fillRect(0,0,CW,CH);
  renderFlow(fl => {
    fl.line('CLUSTER OVERLOADED!', { size:20, color:G.red, gap:6 });
    fl.line('Datacenter capacity exhausted.', { kind:'body', size:18, color:G.dim, gap:30 });
    fl.line('FINAL SCORE: ' + score, { size:14, color:'#FFFFFF', gap:10 });
    fl.line('LINES CLEARED: ' + lines + '   |   LEVEL REACHED: ' + level, { kind:'body', size:18, color:G.text, gap:4 });
    fl.line('MAX REGION: ' + regionName(), { kind:'body', size:18, color:G.green, gap:4 });
    fl.line('PEAK POWER LOAD: ' + peakPower + 'W', { kind:'body', size:18, color:'#E37400', gap:30 });
    const record = score >= highScore && score > 0;
    if (!fl.dry && record) ctx.globalAlpha = 0.7 + 0.3 * Math.sin(frame * 0.1);
    fl.line(record ? '★ NEW HIGH SCORE RECORD ★' : '', { size:14, color:G.yellow, gap:30 });
    ctx.globalAlpha = 1;
    fl.line(blink() ? 'PRESS ENTER TO SUBMIT SCORE' : '', { size:14, color:G.green, gap:30 });
    fl.line('[L] VIEW LEADERBOARD   |   [ESC] TITLE SCREEN', { kind:'body', size:18, color:G.dim });
  }, { x:CW / 2, top:100, bottom:CH - 100, align:'center', max:CW - 40, center:true });
}

// ─── Name Entry Screen ───
function drawNameEntry() {
  ctx.fillStyle='rgba(18,20,24,0.96)'; ctx.fillRect(0,0,CW,CH);
  renderFlow(fl => {
    fl.line('HIGH SCORE ENTRY', { size:18, color:G.yellow, gap:20 });
    fl.line('SCORE: ' + score, { size:14, color:G.text, gap:4 });
    fl.line('REGION: ' + regionName(), { kind:'body', size:18, color:G.green, gap:30 });
    fl.line('ENTER YOUR INITIALS', { size:12, color:G.dim, gap:16 });

    const slotW = Math.max(50, fontPx('pixel', 28) + 16), slotH = Math.max(60, fontPx('pixel', 28) + 28);
    const arrowH = lineH('pixel', 16), pitch = slotW + 15;
    fl.box(slotH + arrowH * 2 + 8, (cx, y) => {
      const startX = cx - (3 * slotW + 2 * 15) / 2;
      for (let i = 0; i < 3; i++) {
        const slotX = startX + i * pitch, slotY = y + arrowH + 4, sel = i === nameCursor;
        ctx.fillStyle = sel ? '#303134' : '#222328'; ctx.fillRect(slotX, slotY, slotW, slotH);
        ctx.strokeStyle = sel ? G.yellow : '#5F6368'; ctx.lineWidth = sel ? 3 : 1; ctx.strokeRect(slotX, slotY, slotW, slotH);
        if (sel) {
          text('▲', slotX + slotW / 2, y, { size:16, color:G.yellow, align:'center' });
          text('▼', slotX + slotW / 2, slotY + slotH + 4, { size:16, color:G.yellow, align:'center' });
        }
        text(nameChars[i], slotX + slotW / 2, slotY + slotH / 2 + 2, { size:28, color: sel ? G.yellow : '#FFFFFF', align:'center', baseline:'middle' });
      }
    });
    fl.gap(30);
    fl.line('← → : SELECT SLOT      ↑ ↓ : CHANGE LETTER', { kind:'body', size:18, color:G.dim, gap:24 });
    fl.line(blink() ? 'PRESS ENTER TO CONFIRM' : '', { size:14, color:G.green });
  }, { x:CW / 2, top:60, bottom:CH - 60, align:'center', max:CW - 40, center:true });
}

// ─── Leaderboard Screen ───
function drawLeaderboard() {
  ctx.fillStyle=G.bg; ctx.fillRect(0,0,CW,CH);
  const cx = CW / 2;
  let y = 28;
  text('★ GLOBAL TOP 10 RANKINGS ★', cx, y, { size:16, color:G.yellow, align:'center', max:CW - 40 });
  y += lineH('pixel', 16);
  text(leaderboardStatus || 'ONLINE TELEMETRY', cx, y, { kind:'body', size:18, color:G.dim, align:'center', max:CW - 40 });
  y += lineH('body', 18) + 10;

  const tx = 40, ty = y, tw = CW - 80;
  const headH = lineH('label', 12) + 18;
  const rowH = Math.max(lineH('pixel', 12), lineH('body', 18)) + 18;
  const th = headH + 10 * rowH + 16;
  ctx.fillStyle='#18191C'; ctx.fillRect(tx,ty,tw,th);
  ctx.strokeStyle='#3C4043'; ctx.lineWidth=2; ctx.strokeRect(tx,ty,tw,th);

  const col = [0.04, 0.19, 0.40, 0.66].map(f => tx + Math.round(tw * f));
  const colW = [col[1] - col[0], col[2] - col[1], col[3] - col[2], tx + tw - col[3]].map(w => w - 10);
  const lbl = { kind:'label', size:12, color:G.dim };
  ['RANK', 'NAME', 'SCORE', 'DATACENTER'].forEach((h, i) => text(h, col[i], ty + 9, Object.assign({ max:colW[i] }, lbl)));
  ctx.fillStyle='#3C4043'; ctx.fillRect(tx+15, ty+headH-4, tw-30, 2);

  if (leaderboardLoading) {
    text('CONNECTING TO CLOUD...', cx, ty + th / 2, { size:13, color:G.yellow, align:'center', baseline:'middle', max:tw - 20 });
  } else if (!leaderboardData || leaderboardData.length === 0) {
    text('NO SCORES RECORDED YET', cx, ty + th / 2, { size:13, color:G.dim, align:'center', baseline:'middle', max:tw - 20 });
  } else {
    leaderboardData.slice(0, 10).forEach((entry, idx) => {
      const ry = ty + headH + 8 + idx * rowH + rowH / 2, rank = idx + 1;
      let rankColor = G.text, badge = String(rank);
      if (rank === 1) { rankColor = '#FBBC04'; badge = '1ST'; }
      else if (rank === 2) { rankColor = '#7BAAF7'; badge = '2ND'; }
      else if (rank === 3) { rankColor = '#34A853'; badge = '3RD'; }
      const mid = { baseline:'middle' };
      text(badge, col[0], ry, Object.assign({ size:12, color:rankColor, max:colW[0] }, mid));
      text(entry.name || '???', col[1], ry, Object.assign({ size:12, color:'#FFFFFF', max:colW[1] }, mid));
      text(String(entry.score || 0).padStart(7, '0'), col[2], ry, Object.assign({ size:12, color:G.yellow, max:colW[2] }, mid));
      text(entry.region || 'us-central1', col[3], ry, Object.assign({ kind:'body', size:18, color:G.dim, max:colW[3] }, mid));
    });
  }

  if (blink()) text('PRESS [ESC] OR [ENTER] TO RETURN', cx, CH - 40, { size:12, color:G.yellow, align:'center', max:CW - 40 });
}

// ─── Options Screen ───
let optCursor = 0;
function drawOptions() {
  ctx.fillStyle=G.bg; ctx.fillRect(0,0,CW,CH);
  const left = 40, right = CW - 40;
  renderFlow(fl => {
    fl.line('SYSTEM OPTIONS', { size:18, color:G.yellow, gap:8 });
    fl.line('CHANGES APPLY INSTANTLY AND ARE SAVED', { kind:'body', size:18, color:G.dim, gap:24 });
    const rowH = lineH('pixel', 14) + 22;
    OPTION_ROWS.forEach((row, i) => {
      const sel = i === optCursor;
      fl.box(rowH, (x, y, h) => {
        if (sel) {
          ctx.fillStyle = '#303134'; ctx.fillRect(left, y, right - left, h);
          ctx.strokeStyle = G.yellow; ctx.lineWidth = 2; ctx.strokeRect(left, y, right - left, h);
        }
        const ty = y + h / 2 + 1;
        text(row.name, left + 14, ty, { size:14, color: sel ? '#FFFFFF' : G.text, baseline:'middle', max:(right - left) * 0.5 });
        const val = row.opts[settings[row.key]].label, vx = right - 14;
        if (sel) {
          text('>', vx, ty, { size:14, color:G.yellow, align:'right', baseline:'middle' });
          const aw = ctx.measureText('> ').width;
          text(val, vx - aw, ty, { size:14, color:G.yellow, align:'right', baseline:'middle', max:(right - left) * 0.4 });
          const vw = ctx.measureText(val).width;
          text('<', vx - aw - vw - aw, ty, { size:14, color:G.yellow, align:'right', baseline:'middle' });
        } else {
          text(val, vx, ty, { size:14, color:G.dim, align:'right', baseline:'middle', max:(right - left) * 0.4 });
        }
      });
      fl.gap(8);
    });
    fl.gap(10);
    fl.line(OPTION_ROWS[optCursor].hint, { kind:'body', size:18, color:G.text, gap:30 });
    fl.line('↑↓ SELECT    ←→ CHANGE    [ESC] BACK', { kind:'body', size:18, color:G.dim });
  }, { x:CW / 2, top:40, bottom:CH - 40, align:'center', max:CW - 40, center:true });
}

// ─── Update ───
function update() {
  frame++;
  if (state!==ST.PLAY) return;
  updateParticles();
  if (msgTimer>0) msgTimer--;
  if (shakeTimer>0) { shakeTimer--; shakeX=(Math.random()-0.5)*6; shakeY=(Math.random()-0.5)*6; }
  else { shakeX=0; shakeY=0; }
  if (flashTimer>0) flashTimer--;
  if (power > 80 && frame % 60 === 0) SFX.powerWarn();
  if (clearTimer>0) { clearTimer--; if(!clearTimer) finishClear(); return; }
  if (!piece) return;
  dropTimer++;
  const spd = Math.max(3, 48-(level-1)*4);
  if (dropTimer>=spd) { dropTimer=0; if(!movePiece(0,1)) { if(lockTimer<=0) lockTimer=30; } }
  if (!isValid(piece.shape,piece.x,piece.y+1)) { if(lockTimer>0){lockTimer--;if(lockTimer<=0)lockPiece();} }
  else lockTimer=0;
}

// ─── Draw frame ───
function draw() {
  ctx.fillStyle=G.bg; ctx.fillRect(0,0,CW,CH);
  switch(state) {
    case ST.MENU: drawTitle(); break;
    case ST.PLAY:
      ctx.save(); ctx.translate(shakeX, shakeY);
      drawHeader(); drawPowerBar(); drawBoard(); drawPiece(); drawParticles(); drawMsg(); drawSidebar();
      ctx.restore();
      drawFlash();
      break;
    case ST.PAUSE:
      drawHeader(); drawPowerBar(); drawBoard(); drawSidebar(); drawPause(); break;
    case ST.OVER:
      drawHeader(); drawBoard(); drawParticles(); drawSidebar(); drawOver(); break;
    case ST.NAME_ENTRY:
      drawNameEntry(); break;
    case ST.LEADERBOARD:
      drawLeaderboard(); break;
    case ST.OPTIONS:
      drawOptions(); break;
  }
}

// ─── Input ───
function openOptions(returnTo) { prevState = returnTo; state = ST.OPTIONS; }
function openLeaderboard(returnTo) { prevState = returnTo; state = ST.LEADERBOARD; loadLeaderboard(); }

document.addEventListener('keydown', e => {
  // Text-size shortcut works on every screen.
  if (e.key === '[' || e.key === ']') {
    cycleSetting('text', e.key === ']' ? 1 : -1);
    SFX.charSelect();
    e.preventDefault();
    return;
  }

  if (state===ST.MENU) {
    if(e.key==='Enter'){ startGame(); e.preventDefault(); }
    else if(e.key==='l'||e.key==='L'){ openLeaderboard(ST.MENU); e.preventDefault(); }
    else if(e.key==='o'||e.key==='O'){ openOptions(ST.MENU); e.preventDefault(); }
    return;
  }

  if (state===ST.OPTIONS) {
    if (e.key==='ArrowUp')        { optCursor = (optCursor + OPTION_ROWS.length - 1) % OPTION_ROWS.length; SFX.charSelect(); }
    else if (e.key==='ArrowDown') { optCursor = (optCursor + 1) % OPTION_ROWS.length; SFX.charSelect(); }
    else if (e.key==='ArrowLeft') { cycleSetting(OPTION_ROWS[optCursor].key, -1); SFX.rotate(); }
    else if (e.key==='ArrowRight' || e.key==='Enter' || e.key===' ') { cycleSetting(OPTION_ROWS[optCursor].key, 1); SFX.rotate(); }
    else if (e.key==='Escape' || e.key==='o' || e.key==='O') { state = prevState || ST.MENU; }
    e.preventDefault();
    return;
  }

  if (state===ST.LEADERBOARD) {
    if(e.key==='Escape' || e.key==='Enter' || e.key==='l' || e.key==='L'|| e.key===' '){
      state = prevState || ST.MENU;
      e.preventDefault();
    }
    return;
  }

  if (state===ST.OVER) {
    if(e.key==='Enter' || e.key===' '){
      if (score > 0) { state = ST.NAME_ENTRY; nameCursor = 0; }
      else { state = ST.MENU; }
      e.preventDefault();
    } else if(e.key==='l' || e.key==='L'){ openLeaderboard(ST.OVER); e.preventDefault(); }
    else if(e.key==='o' || e.key==='O'){ openOptions(ST.OVER); e.preventDefault(); }
    else if(e.key==='Escape'){ state = ST.MENU; e.preventDefault(); }
    return;
  }

  if (state===ST.NAME_ENTRY) {
    if (e.key==='ArrowLeft') {
      nameCursor = (nameCursor + 2) % 3;
      SFX.charSelect();
      e.preventDefault();
    } else if (e.key==='ArrowRight') {
      nameCursor = (nameCursor + 1) % 3;
      SFX.charSelect();
      e.preventDefault();
    } else if (e.key==='ArrowUp') {
      let idx = LETTERS.indexOf(nameChars[nameCursor]);
      idx = (idx + 1) % LETTERS.length;
      nameChars[nameCursor] = LETTERS[idx];
      SFX.charSelect();
      e.preventDefault();
    } else if (e.key==='ArrowDown') {
      let idx = LETTERS.indexOf(nameChars[nameCursor]);
      idx = (idx - 1 + LETTERS.length) % LETTERS.length;
      nameChars[nameCursor] = LETTERS[idx];
      SFX.charSelect();
      e.preventDefault();
    } else if (e.key.length === 1 && LETTERS.includes(e.key.toUpperCase())) {
      nameChars[nameCursor] = e.key.toUpperCase();
      nameCursor = Math.min(2, nameCursor + 1);
      SFX.charSelect();
      e.preventDefault();
    } else if (e.key==='Enter' || e.key===' ') {
      const finalName = nameChars.join('');
      SFX.submit();
      recordScore(finalName, score, regionName());
      openLeaderboard(ST.MENU);
      e.preventDefault();
    }
    return;
  }

  if (state===ST.PAUSE) {
    if(e.key==='p'||e.key==='P') state=ST.PLAY;
    else if(e.key==='q'||e.key==='Q') state=ST.MENU;
    else if(e.key==='l'||e.key==='L') openLeaderboard(ST.PAUSE);
    else if(e.key==='o'||e.key==='O') openOptions(ST.PAUSE);
    return;
  }

  if (state===ST.PLAY && clearTimer<=0) {
    switch(e.key) {
      case 'ArrowLeft': movePiece(-1,0); break;
      case 'ArrowRight': movePiece(1,0); break;
      case 'ArrowDown': softDrop(); break;
      case 'ArrowUp': rotatePiece(); break;
      case ' ': hardDrop(); break;
      case 'c': case 'C': doHold(); break;
      case 'p': case 'P': state=ST.PAUSE; break;
      case 'l': case 'L': openLeaderboard(ST.PLAY); break;
      case 'o': case 'O': openOptions(ST.PAUSE); break; // resume into pause, not straight into play
    }
  }
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});

document.addEventListener('visibilitychange', ()=>{ if(document.hidden && state===ST.PLAY) state=ST.PAUSE; });

// Initial Leaderboard pre-load
loadLeaderboard();

// ─── Loop ───
// Fixed 60 Hz simulation step with an accumulator, so game speed is the same
// on 60/120/144 Hz displays. Drawing still happens once per animation frame.
const STEP_MS = 1000 / 60;
const MAX_FRAME_MS = 250; // cap catch-up after a stall (e.g. tab hidden)
frame = 0;
let lastTime = 0, accumulator = 0;
function loop(now) {
  accumulator += Math.min(now - lastTime, MAX_FRAME_MS);
  lastTime = now;
  while (accumulator >= STEP_MS) { update(); accumulator -= STEP_MS; }
  fitCanvas();
  draw();
  requestAnimationFrame(loop);
}
function startLoop() { lastTime = performance.now(); requestAnimationFrame(loop); }

// Wait (briefly) for the web fonts so the first frames are not drawn in a
// fallback font; start anyway after 2.5 s if they have not arrived.
const FONT_LOADS = ['12px "Press Start 2P"', '700 12px "Silkscreen"', '18px "VT323"'];
if (document.fonts && document.fonts.load) {
  Promise.race([
    Promise.all(FONT_LOADS.map(f => document.fonts.load(f).catch(() => {}))),
    new Promise(r => setTimeout(r, 2500)),
  ]).then(startLoop);
} else {
  startLoop();
}
</script>
