const CW = 580, CH = 720;

const F_PIXEL = '"Press Start 2P", monospace';

            bg:'#202124', surface:'#303134', text:'#E8EAED', dim:'#9AA0A6', border:'#5F6368' };

const PIECES = [

  { name:'VM n2-std-8',  color:'#34A853', shape:[[0,1,1],[1,1,0]],     desc:'8 vCPU / 32GB',   pw:5  },
  { name:'VM m2-ultra',  color:'#EA4335', shape:[[1,1,0],[0,1,1]],     desc:'416 vCPU / 12TB', pw:6  },
  { name:'GPU A3 Mega',  color:'#FBBC04', shape:[[1,1,1],[0,1,0]],     desc:'8x H100 / 80GB',  pw:10 },
  { name:'TPU v5p Pod',  color:'#7BAAF7', shape:[[1,1,1,1]],           desc:'8960 chips',       pw:14 },

  { name:'K8s Pod',      color:'#C5221F', shape:[[0,1],[0,1],[1,1]],   desc:'Container wkld',   pw:5  },

];

const DATACENTERS = [
  { name:'us-central1',     cond:'clean' },
  { name:'us-east1',        cond:'moderate' },
  { name:'us-east5',        cond:'terrible' },
  { name:'europe-west1',    cond:'clean' },

  { name:'europe-north1',   cond:'clean' },
  { name:'asia-east1',      cond:'bad' },
  { name:'asia-northeast1', cond:'terrible' },
  { name:'asia-south1',     cond:'bad' },
  { name:'us-west1',        cond:'moderate' },
  { name:'us-west4',        cond:'bad' },
  { name:'australia-se1',   cond:'bad' },
  { name:'southam-east1',   cond:'terrible' },
  { name:'me-central1',     cond:'terrible' },

];
const DC_LABELS = { clean:'CLEAN RACKS', moderate:'LEGACY WORKLOADS', bad:'BAD BIN-PACKING', terrible:'DISASTER ZONE' };
const DC_COLORS = { clean:G.green, moderate:G.blue, bad:G.yellow, terrible:G.red };
const LINE_PTS = [0, 100, 300, 500, 800];
const CLEAR_MSG = [null, ['OPTIMIZED!',G.green], ['AUTOSCALED!',G.blue],
                   ['REGION EXPANDED!',G.yellow], ['>>> GLOBAL DEPLOY <<<',G.red]];
const POWER_REDUCTION = [0, 15, 30, 50, 80];
const MAX_POWER = 100;
const REGIONS = ['us-central1','us-east1','europe-west1','asia-east1','us-west1',
                 'europe-west4','asia-northeast1','us-east5','australia-se1','GLOBAL'];

// ─── Audio ───
let audioCtx;
function initAudio() { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
function beep(freq, dur, type='square', vol=0.07) {
  if (!audioCtx) return;
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
const SFX = {
  move:     () => beep(220, 0.03),
  rotate:   () => beep(330, 0.03),
  lock:     () => beep(110, 0.08, 'triangle'),
  drop:     () => beep(80, 0.12, 'triangle', 0.1),
  clear:    () => { beep(523,0.07); setTimeout(()=>beep(659,0.07),80); setTimeout(()=>beep(784,0.1),160); },
  tetris:   () => { beep(523,0.07); setTimeout(()=>beep(659,0.07),60); setTimeout(()=>beep(784,0.07),120); setTimeout(()=>beep(1047,0.15),180); },
  levelUp:  () => { for(let i=0;i<5;i++) setTimeout(()=>beep(440+i*110,0.07),i*60); },
  over:     () => { beep(400,0.15); setTimeout(()=>beep(300,0.15),150); setTimeout(()=>beep(200,0.25),300); },
  ctrl:     () => { beep(880,0.05); setTimeout(()=>beep(660,0.06),50); },
  throttle: () => { beep(150,0.2,'sawtooth',0.1); setTimeout(()=>beep(100,0.3,'sawtooth',0.08),150); },
  gigawatt: () => { for(let i=0;i<8;i++) setTimeout(()=>beep(300+i*120,0.06,'square',0.09),i*40); },
  powerWarn:() => beep(600, 0.04, 'square', 0.04),
  charSelect:() => beep(480, 0.04, 'triangle'),
  submit:   () => { beep(523,0.08); setTimeout(()=>beep(659,0.08),70); setTimeout(()=>beep(880,0.15),140); },
};

// ─── Utilities ───
function hexRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function rgbHex(r,g,b){return'#'+[r,g,b].map(c=>Math.max(0,Math.min(255,Math.round(c))).toString(16).padStart(2,'0')).join('');}
function lighten(h,a){const[r,g,b]=hexRgb(h);return rgbHex(r+a,g+a,b+a);}
function darken(h,a){const[r,g,b]=hexRgb(h);return rgbHex(r-a,g-a,b-a);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rotMat(m){const R=m.length,C=m[0].length,o=[];for(let j=0;j<C;j++){o[j]=[];for(let i=R-1;i>=0;i--)o[j][R-1-i]=m[i][j];}return o;}

// ─── Leaderboard Engine (Dreamlo + LocalStorage) ───
const DEFAULT_SCORES = [
  { name:'GKE', score:24500, region:'GLOBAL' },
  { name:'SRE', score:19800, region:'us-central1' },
  { name:'K8S', score:15200, region:'europe-west1' },
  { name:'TPU', score:11400, region:'asia-east1' },
  { name:'BOR', score:8600,  region:'us-west1' },
  { name:'VMM', score:6200,  region:'us-east1' },
  { name:'POD', score:4300,  region:'europe-west4' },
  { name:'NET', score:2800,  region:'australia-se1' },
  { name:'OPS', score:1500,  region:'southam-east1' },
  { name:'DEV', score:800,   region:'us-east5' },
];

let leaderboardData = [];
let leaderboardLoading = false;
let leaderboardStatus = '';

function getLocalLeaderboard() {
  try {
    const raw = localStorage.getItem('cc_leaderboard_v2');
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return [...DEFAULT_SCORES];
}

function saveLocalLeaderboard(list) {
  try {
    localStorage.setItem('cc_leaderboard_v2', JSON.stringify(list.slice(0, 10)));
  } catch(e) {}
}

async function loadLeaderboard() {
  leaderboardLoading = true;
  leaderboardStatus = 'FETCHING TELEMETRY...';
  const localList = getLocalLeaderboard();
  leaderboardData = localList;

  if (LEADERBOARD_CONFIG.enabled && LEADERBOARD_CONFIG.dreamloPublicCode) {
    try {
      const url = `https://www.dreamlo.com/lb/${LEADERBOARD_CONFIG.dreamloPublicCode}/json/10`;
      const res = await fetch(url);
      if (res.ok) {
        const data = await res.json();
        if (data && data.dreamlo && data.dreamlo.leaderboard) {
          let entries = data.dreamlo.leaderboard.entry;
          if (entries) {
            if (!Array.isArray(entries)) entries = [entries];
            leaderboardData = entries.map(e => ({
              name: (e.name || '???').toUpperCase().slice(0, 3),
              score: parseInt(e.score) || 0,
              region: e.text || 'us-central1'
            }));
            leaderboardStatus = 'GLOBAL CLOUD SYNCED';
            leaderboardLoading = false;
            return;
          }
        }
      }
    } catch(err) {
      console.warn('Dreamlo fetch error, fallback to local', err);
    }
  }

  leaderboardStatus = 'LOCAL CLOUD ARCHIVE';
  leaderboardLoading = false;
}

async function recordScore(name, scoreNum, regionStr) {
  const cleanName = (name || 'AAA').toUpperCase().slice(0, 3);
  const cleanRegion = regionStr || 'us-central1';
  
  // Update local
  let list = getLocalLeaderboard();
  list.push({ name: cleanName, score: scoreNum, region: cleanRegion });
  list.sort((a,b) => b.score - a.score);
  list = list.slice(0, 10);
  saveLocalLeaderboard(list);
  leaderboardData = list;

  // Submit to Dreamlo if configured
  if (LEADERBOARD_CONFIG.enabled && LEADERBOARD_CONFIG.dreamloPrivateCode) {
    try {
      const url = `https://www.dreamlo.com/lb/${LEADERBOARD_CONFIG.dreamloPrivateCode}/add/${encodeURIComponent(cleanName)}/${scoreNum}/0/${encodeURIComponent(cleanRegion)}`;
      await fetch(url);
    } catch(e) {
      console.warn('Failed to post to Dreamlo', e);
    }
  }
}

// ─── State ───
const ST = { MENU:0, PLAY:1, PAUSE:2, OVER:3, LEADERBOARD:4, NAME_ENTRY:5 };
let state = ST.MENU;
let prevState = ST.MENU;
let board, piece, nextType, holdType, canHold, bag, score, highScore, lines, level;
let dropTimer, lockTimer, clearRows, clearTimer, forceCtrl;
let particles, msg, msgTimer, msgColor, frame;
let power, shakeTimer, shakeX, shakeY, flashTimer, flashColor;
let gigawattPending, ctrlPlaneRows;
let currentDC = 0;

// Name Entry State
const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!?_";
let nameChars = ['A', 'A', 'A'];
let nameCursor = 0;

highScore = parseInt(localStorage.getItem('ccHS') || '0');
const initialLocal = getLocalLeaderboard();
if (initialLocal.length > 0 && initialLocal[0].score > highScore) {
  highScore = initialLocal[0].score;
}

function resetState() {
  board = Array.from({length:ROWS}, ()=>new Array(COLS).fill(0));
  score=0; lines=0; level=1; holdType=-1; canHold=true; forceCtrl=false;
  particles=[]; msg=''; msgTimer=0; dropTimer=0; lockTimer=0;
  clearRows=[]; clearTimer=0; bag=[]; power=0;
  shakeTimer=0; shakeX=0; shakeY=0; flashTimer=0; flashColor='#FFF';
  gigawattPending=false; ctrlPlaneRows=0;
  const dc = pickRegion();
  generateInheritedWorkload(dc.cond, true);
  fillBag(); nextType=pullBag(); spawnNext();
  showMsg(dc.name, DC_COLORS[dc.cond], 120);
}

// ─── Piece bag ───
function fillBag() { bag = shuffle([0,1,2,3,4,5,6]); }
function pullBag() {
  if (forceCtrl) { forceCtrl = false; return 7; }
  if (!bag.length) fillBag();
  return bag.pop();
}
function mkPiece(t) {
  const d = PIECES[t], s = d.shape.map(r=>[...r]);
  return { type:t, shape:s, x:Math.floor((COLS-s[0].length)/2), y:0, color:d.color };
}
function spawnNext() {
  piece = mkPiece(nextType);
  nextType = pullBag();
  canHold = true; dropTimer = 0; lockTimer = 0;
  if (piece.type === 7) { showMsg('CTRL PLANE DEPLOYING!', '#E37400', 90); SFX.ctrl(); }
  if (!isValid(piece.shape, piece.x, piece.y)) gameOver();
}

// ─── Board ops ───
function isValid(s, px, py) {
  for (let y=0; y<s.length; y++) for (let x=0; x<s[y].length; x++)
    if (s[y][x]) { const bx=px+x, by=py+y;
      if (bx<0||bx>=COLS||by>=ROWS) return false;
      if (by>=0 && board[by][bx]) return false; }
  return true;
}
function getGhostY() { let gy=piece.y; while(isValid(piece.shape,piece.x,gy+1)) gy++; return gy; }

// ─── Power system ───
function addPower(amount) {
  power = Math.min(MAX_POWER, power + amount);
  if (power >= MAX_POWER) thermalThrottle();
}
function reducePower(amount) { power = Math.max(0, power - amount); }

function thermalThrottle() {
  showMsg('⚠ THERMAL THROTTLE! ⚠', G.red, 120);
  SFX.throttle();
  startShake(15);
  startFlash('#EA4335', 10);
  addGarbageRow();
  power = 45;
}

function addGarbageRow() {
  if (board[0].some(c => c !== 0)) { gameOver(); return; }
  board.shift();
  const row = new Array(COLS).fill(GARBAGE_ID);
  const gaps = 2 + Math.floor(Math.random() * 2);
  const positions = shuffle([...Array(COLS).keys()]).slice(0, gaps);
  positions.forEach(i => { row[i] = 0; });
  board.push(row);
  if (piece && !isValid(piece.shape, piece.x, piece.y)) {
    piece.y--;
    if (piece.y < 0 || !isValid(piece.shape, piece.x, piece.y)) gameOver();
  }
}

function triggerGigawatt() {
  showMsg('⚡ GIGAWATT SURGE! ⚡', '#FFD700', 120);
  SFX.gigawatt();
  startShake(12);
  startFlash('#FBBC04', 15);
  power = 0;
  let bestRow = -1, bestFill = 0;
  for (let y = ROWS-1; y >= 0; y--) {
    if (clearRows.includes(y)) continue;
    const fill = board[y].filter(c => c !== 0).length;
    if (fill > bestFill) { bestFill = fill; bestRow = y; }
  }
  if (bestRow >= 0 && bestFill >= 3) {
    clearRows.push(bestRow);
    spawnParticles(bestRow);
    score += 200 * level;
  }
}

function pickRegion() {
  let idx;
  do { idx = Math.floor(Math.random() * DATACENTERS.length); } while (idx === currentDC);
  currentDC = idx;
  return DATACENTERS[idx];
}

function generateInheritedWorkload(cond, isStart) {
  const cfgs = {
    clean:    { rows:[0,1], fill:[0.1,0.2] },
    moderate: { rows:[1,2], fill:[0.2,0.4] },
    bad:      { rows:[2,4], fill:[0.35,0.55] },
    terrible: { rows:[3,6], fill:[0.5,0.75] },
  };
  const cfg = cfgs[cond];
  let numRows = cfg.rows[0] + Math.floor(Math.random() * (cfg.rows[1] - cfg.rows[0] + 1));
  if (!isStart) numRows = Math.min(numRows, 3);
  for (let i = 0; i < numRows; i++) {
    if (board[0].some(c => c !== 0)) break;
    board.shift();
    const row = new Array(COLS).fill(0);
    const fp = cfg.fill[0] + Math.random() * (cfg.fill[1] - cfg.fill[0]);
    for (let c = 0; c < COLS; c++) {
      if (Math.random() < fp) {
        const t = Math.floor(Math.random() * 7) + 1;
        row[c] = t;
        if (c + 1 < COLS && Math.random() < 0.4) { row[++c] = t; }
      }
    }
    if (row.filter(c => c !== 0).length >= COLS - 1) {
      const idxs = shuffle([...Array(COLS).keys()]);
      row[idxs[0]] = 0; row[idxs[1]] = 0;
    }
    board.push(row);
  }
}

// ─── Movement ───
function movePiece(dx, dy) {
  if (!piece) return false;
  if (isValid(piece.shape, piece.x+dx, piece.y+dy)) {
    piece.x += dx; piece.y += dy;
    if (dx !== 0) { SFX.move(); if (!isValid(piece.shape,piece.x,piece.y+1)) lockTimer=30; }
    return true;
  }
  return false;
}
function rotatePiece() {
  if (!piece || piece.type===0) return;
  const r = rotMat(piece.shape);
  for (const [dx,dy] of [[0,0],[-1,0],[1,0],[0,-1],[-2,0],[2,0],[0,-2]]) {
    if (isValid(r, piece.x+dx, piece.y+dy)) {
      piece.shape=r; piece.x+=dx; piece.y+=dy; SFX.rotate();
      if (!isValid(piece.shape,piece.x,piece.y+1)) lockTimer=30;
      return;
    }
  }
}
function hardDrop() {
  if (!piece) return;
  let d=0; while(movePiece(0,1)) d++;
  score += d*2; SFX.drop(); lockPiece();
}
function softDrop() { if (movePiece(0,1)) { score+=1; dropTimer=0; } }

// ─── Lock & Clear ───
function lockPiece() {
  if (!piece) return;
  const s = piece.shape;
  const lockedType = piece.type;
  for (let y=0; y<s.length; y++) for (let x=0; x<s[y].length; x++)
    if (s[y][x]) { const by=piece.y+y, bx=piece.x+x;
      if (by<0) { gameOver(); return; }
      board[by][bx] = lockedType+1; }
  SFX.lock();
  addPower(PIECES[lockedType].pw);
  if (lockedType === 5) forceCtrl = true;
  if (lockedType === 7) {
    startFlash('#E37400', 8);
    startShake(6);
  }
  clearRows = [];
  ctrlPlaneRows = 0;
  for (let y=0; y<ROWS; y++) if (board[y].every(c=>c)) {
    clearRows.push(y);
    if (board[y].some(c => c === 8)) ctrlPlaneRows++;
  }
  if (clearRows.length) {
    const n = clearRows.length;
    if (n >= 3 || (n >= 2 && Math.random() < 0.4)) gigawattPending = true;
    else gigawattPending = false;
    clearTimer = 22;
    clearRows.forEach(y => spawnParticles(y));
    if (n >= 4) SFX.tetris(); else SFX.clear();
    reducePower(POWER_REDUCTION[Math.min(n, 4)]);
  } else { spawnNext(); }
}

function finishClear() {
  if (gigawattPending) { gigawattPending = false; triggerGigawatt(); }
  const n = clearRows.length;
  for (const y of [...clearRows].sort((a,b)=>b-a)) { board.splice(y,1); board.unshift(new Array(COLS).fill(0)); }
  let pts = LINE_PTS[Math.min(n, 4)] * level;
  if (ctrlPlaneRows > 0) {
    pts += 200 * ctrlPlaneRows * level;
    showMsg('OVERHEAD ELIMINATED! +' + (200*ctrlPlaneRows*level), '#E37400', 100);
  } else {
    const nl = Math.floor((lines+n)/10)+1;
    if (nl > level) { showMsg('LEVEL '+nl+': '+REGIONS[Math.min(nl-1,9)], G.blue, 120); }
    else { const cm=CLEAR_MSG[Math.min(n,4)]; if(cm) showMsg(cm[0],cm[1]); }
  }
  score += pts;
  lines += n;
  const nl = Math.floor(lines/10)+1;
  if (nl > level) { level=nl; SFX.levelUp(); }
  clearRows = []; spawnNext();
}

function doHold() {
  if (!piece || !canHold) return;
  canHold = false;
  if (holdType === -1) { holdType=piece.type; spawnNext(); }
  else { const t=holdType; holdType=piece.type; piece=mkPiece(t); }
}

function gameOver() {
  state = ST.OVER; SFX.over();
  if (score > highScore) { highScore=score; localStorage.setItem('ccHS', String(highScore)); }
}
function startGame() { state=ST.PLAY; if(!audioCtx)initAudio(); resetState(); }

// ─── Effects ───
function startShake(dur) { shakeTimer=dur; }
function startFlash(color, dur) { flashColor=color; flashTimer=dur; }

function spawnParticles(row) {
  for (let x=0;x<COLS;x++) for (let i=0;i<4;i++)
    particles.push({ x:BOARD_X+x*CELL+Math.random()*CELL, y:BOARD_Y+row*CELL+Math.random()*CELL,
      vx:(Math.random()-0.5)*10, vy:-(Math.random()*6+2),
      color:GCOLORS[Math.floor(Math.random()*4)], life:30+Math.random()*25, size:2+Math.random()*5 });
}
function spawnPowerParticles() {
  for (let i=0;i<20;i++)
    particles.push({ x:BOARD_X+Math.random()*BOARD_W, y:BOARD_Y+BOARD_H,
      vx:(Math.random()-0.5)*3, vy:-(Math.random()*8+4),
      color:Math.random()>0.5?'#FFD700':'#FF6600', life:40+Math.random()*20, size:2+Math.random()*3 });
}
function updateParticles() { particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;return --p.life>0;}); }
function showMsg(t,c='#FFF',d=90) { msg=t; msgColor=c; msgTimer=d; }

// ─── Cell drawing with chip patterns ───
function drawCell(px, py, color, cellType, ghost) {
  if (ghost) {
    ctx.strokeStyle=color; ctx.globalAlpha=0.3; ctx.lineWidth=2;
    ctx.strokeRect(px+2,py+2,CELL-4,CELL-4); ctx.globalAlpha=1; ctx.lineWidth=1;
    return;
  }
  // Base fill
  ctx.fillStyle=color; ctx.fillRect(px,py,CELL,CELL);
  // 3D edges
  ctx.fillStyle=lighten(color,50); ctx.fillRect(px,py,CELL,2); ctx.fillRect(px,py,2,CELL);
  ctx.fillStyle=darken(color,60); ctx.fillRect(px,py+CELL-2,CELL,2); ctx.fillRect(px+CELL-2,py,2,CELL);

  // Chip-specific internal patterns
  const dc = darken(color, 25);
  const lc = lighten(color, 30);
  ctx.fillStyle = dc;

  if (cellType >= 1 && cellType <= 3) {
    for (let i=0;i<4;i++) ctx.fillRect(px+4+i*6, py+1, 3, 3);
    for (let i=0;i<4;i++) ctx.fillRect(px+4+i*6, py+CELL-4, 3, 3);
    for (let i=0;i<3;i++) ctx.fillRect(px+1, py+5+i*8, 3, 2);
    for (let i=0;i<3;i++) ctx.fillRect(px+CELL-4, py+5+i*8, 3, 2);
    ctx.fillStyle = lighten(color, 15);
    ctx.fillRect(px+7, py+7, CELL-14, CELL-14);
    ctx.fillStyle = lc;
    ctx.fillRect(px+9, py+9, 3, 3);
  }
  else if (cellType === 4) {
    ctx.fillStyle = lighten(color, 20);
    for (let i=0;i<5;i++) ctx.fillRect(px+4, py+4+i*5, CELL-8, 2);
    ctx.fillStyle = dc;
    ctx.fillRect(px+6, py+3, 2, CELL-6);
    ctx.fillRect(px+CELL-8, py+3, 2, CELL-6);
  }
  else if (cellType === 5) {
    ctx.fillStyle = lighten(color, 35);
    for (let r=0;r<4;r++) for (let c=0;c<4;c++) ctx.fillRect(px+4+c*6, py+4+r*6, 3, 3);
    ctx.fillStyle = dc;
    ctx.fillRect(px+3, py+3, CELL-6, 1);
    ctx.fillRect(px+3, py+CELL-4, CELL-6, 1);
    ctx.fillRect(px+3, py+3, 1, CELL-6);
    ctx.fillRect(px+CELL-4, py+3, 1, CELL-6);
  }
  else if (cellType === 6) {
    ctx.fillStyle = lc;
    ctx.fillRect(px+12, py+5, 4, 4);
    ctx.fillRect(px+10, py+9, 8, 4);
    ctx.fillRect(px+8, py+13, 12, 4);
    ctx.fillRect(px+10, py+17, 8, 4);
    ctx.fillRect(px+12, py+21, 4, 3);
    ctx.fillStyle = dc;
    ctx.fillRect(px+13, py+3, 2, 22);
    ctx.fillRect(px+5, py+13, 18, 2);
  }
  else if (cellType === 7) {
    ctx.fillStyle = lc;
    for (let i=0;i<4;i++) ctx.fillRect(px+4+i*6, py+4, 4, 2);
    for (let i=0;i<4;i++) ctx.fillRect(px+4+i*6, py+CELL-6, 4, 2);
    for (let i=0;i<3;i++) ctx.fillRect(px+4, py+6+i*7, 2, 4);
    for (let i=0;i<3;i++) ctx.fillRect(px+CELL-6, py+6+i*7, 2, 4);
    ctx.fillRect(px+12, py+12, 4, 4);
  }
  else if (cellType === 8) {
    ctx.fillStyle = darken(color, 15);
    ctx.fillRect(px+4, py+8, 10, 2);
    ctx.fillRect(px+12, py+8, 2, 8);
    ctx.fillRect(px+12, py+14, 10, 2);
    ctx.fillRect(px+4, py+18, 2, 6);
    ctx.fillRect(px+18, py+4, 2, 12);
    ctx.fillStyle = lighten(color, 40);
    ctx.fillRect(px+4, py+4, 6, 2);
    ctx.fillRect(px+20, py+CELL-6, 4, 2);
  }
  else if (cellType === GARBAGE_ID) {
    ctx.fillStyle = darken(GARBAGE_COLOR, 20);
    for (let i=0;i<CELL-4;i+=4) {
      ctx.fillRect(px+2+i, py+2+i, 3, 3);
      ctx.fillRect(px+CELL-5-i, py+2+i, 3, 3);
    }
    ctx.fillStyle = '#EA4335';
    ctx.fillRect(px+2, py+2, CELL-4, 1);
    ctx.fillRect(px+2, py+CELL-3, CELL-4, 1);
  }
}

function drawBoard() {
  ctx.fillStyle='#16162A'; ctx.fillRect(BOARD_X,BOARD_Y,BOARD_W,BOARD_H);
  ctx.strokeStyle='#22223A'; ctx.lineWidth=1;
  for (let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(BOARD_X+x*CELL,BOARD_Y);ctx.lineTo(BOARD_X+x*CELL,BOARD_Y+BOARD_H);ctx.stroke();}
  for (let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(BOARD_X,BOARD_Y+y*CELL);ctx.lineTo(BOARD_X+BOARD_W,BOARD_Y+y*CELL);ctx.stroke();}
  for (let y=0;y<ROWS;y++) for (let x=0;x<COLS;x++) {
    const v = board[y][x];
    if (v) {
      const color = v === GARBAGE_ID ? GARBAGE_COLOR : PIECES[v-1].color;
      drawCell(BOARD_X+x*CELL, BOARD_Y+y*CELL, color, v);
    }
  }
  if (clearTimer > 0) {
    const fl=Math.floor(clearTimer/3)%2===0;
    clearRows.forEach(y=>{
      ctx.fillStyle=fl?'#FFFFFF':'#E8EAED';
      ctx.fillRect(BOARD_X,BOARD_Y+y*CELL,BOARD_W,CELL);
    });
  }
  const borderColor = power > 80 ? G.red : power > 55 ? G.yellow : G.border;
  ctx.strokeStyle=borderColor; ctx.lineWidth=2;
  ctx.strokeRect(BOARD_X-1,BOARD_Y-1,BOARD_W+2,BOARD_H+2);
  if (power > 70) {
    const pulse = 0.15 + 0.15 * Math.sin(frame * 0.15);
    ctx.globalAlpha = pulse;
    ctx.strokeStyle = G.red;
    ctx.lineWidth = 4;
    ctx.strokeRect(BOARD_X-3,BOARD_Y-3,BOARD_W+6,BOARD_H+6);
    ctx.globalAlpha = 1;
  }
  ctx.lineWidth=1;
}

function drawPiece() {
  if (!piece || clearTimer>0) return;
  const gy = getGhostY();
  if (gy !== piece.y) {
    for (let y=0;y<piece.shape.length;y++) for (let x=0;x<piece.shape[y].length;x++)
      if (piece.shape[y][x] && gy+y>=0)
        drawCell(BOARD_X+(piece.x+x)*CELL, BOARD_Y+(gy+y)*CELL, piece.color, piece.type+1, true);
  }
  for (let y=0;y<piece.shape.length;y++) for (let x=0;x<piece.shape[y].length;x++)
    if (piece.shape[y][x] && piece.y+y>=0)
      drawCell(BOARD_X+(piece.x+x)*CELL, BOARD_Y+(piece.y+y)*CELL, piece.color, piece.type+1);
}

function drawPreview(type, x, y, label) {
  ctx.fillStyle=G.dim; ctx.font='10px '+F_PIXEL; ctx.textAlign='left';
  ctx.fillText(label, x, y);
  if (type<0) { ctx.fillStyle='#4A4A5A'; ctx.font='14px '+F_RETRO; ctx.fillText('[ EMPTY ]',x+12,y+38); return; }
  if (type===7) { ctx.fillStyle='#E37400'; ctx.font='13px '+F_RETRO; ctx.fillText('! CRITICAL OVERHEAD',x,y+16); }
  const d=PIECES[type], s=d.shape, bw=s[0].length*14, bh=s.length*14;
  const ox=x+(84-bw)/2, oy=y+14+(44-bh)/2;
  for (let r=0;r<s.length;r++) for (let c=0;c<s[r].length;c++) if(s[r][c]) {
    const cpx=ox+c*14, cpy=oy+r*14;
    ctx.fillStyle=d.color; ctx.fillRect(cpx,cpy,13,13);
    ctx.fillStyle=lighten(d.color,40); ctx.fillRect(cpx,cpy,13,2); ctx.fillRect(cpx,cpy,2,13);
    ctx.fillStyle=darken(d.color,50); ctx.fillRect(cpx,cpy+11,13,2); ctx.fillRect(cpx+11,cpy,2,13);
    if (type<=2) { ctx.fillStyle=darken(d.color,20); ctx.fillRect(cpx+4,cpy+4,5,5); }
    else if (type===3) { ctx.fillStyle=lighten(d.color,25); for(let i=0;i<3;i++) ctx.fillRect(cpx+3,cpy+3+i*3,7,1); }
    else if (type===4) { ctx.fillStyle=lighten(d.color,30); for(let r2=0;r2<3;r2++) for(let c2=0;c2<3;c2++) ctx.fillRect(cpx+2+c2*3,cpy+2+r2*3,2,2); }
    else if (type===5) { ctx.fillStyle=lighten(d.color,25); ctx.fillRect(cpx+5,cpy+3,3,7); ctx.fillRect(cpx+3,cpy+5,7,3); }
    else if (type===6) { ctx.fillStyle=lighten(d.color,25); for(let i=0;i<3;i++) ctx.fillRect(cpx+3+i*3,cpy+3,2,1); for(let i=0;i<3;i++) ctx.fillRect(cpx+3+i*3,cpy+9,2,1); }
    else if (type===7) { ctx.fillStyle=darken(d.color,15); ctx.fillRect(cpx+3,cpy+5,7,1); ctx.fillRect(cpx+5,cpy+3,1,7); }
  }
  ctx.fillStyle=d.color; ctx.font='14px '+F_RETRO; ctx.fillText(d.name,x,oy+bh+14);
}

function drawPowerBar() {
  const bx=BOARD_X, by=BOARD_Y-20, bw=BOARD_W, bh=12;

      ctx.fillStyle = G.yellow; ctx.font = '16px '+F_PIXEL;
      ctx.fillText('▲', slotX + 25, slotY - 12);
      ctx.fillText('▼', slotX + 25, slotY + 82);
    }
    
    ctx.fillStyle = isSelected ? G.yellow : '#FFFFFF';
    ctx.font = '28px '+F_PIXEL;
    ctx.fillText(nameChars[i], slotX + 25, slotY + 42);
  }
  
  // Instructions
  ctx.fillStyle=G.dim; ctx.font='18px '+F_RETRO;
  ctx.fillText('← → : SELECT SLOT      ↑ ↓ : CHANGE LETTER',CW/2,480);
  
  if (Math.floor(frame/30)%2===0) {
    ctx.fillStyle=G.green; ctx.font='12px '+F_PIXEL;
    ctx.fillText('PRESS ENTER TO CONFIRM',CW/2,535);
  }
  
  ctx.textAlign='left';
}

// ─── Leaderboard Screen ───
function drawLeaderboard() {
  ctx.fillStyle=G.bg; ctx.fillRect(0,0,CW,CH);
  ctx.textAlign='center';
  
  // Header
  ctx.fillStyle=G.yellow; ctx.font='16px '+F_PIXEL;
  ctx.fillText('★ GLOBAL TOP 10 RANKINGS ★',CW/2,55);
  
  ctx.fillStyle=G.dim; ctx.font='16px '+F_RETRO;
  ctx.fillText(leaderboardStatus || 'ONLINE TELEMETRY',CW/2,82);
  
  // Table Background Card
  const tx = 40, ty = 105, tw = CW - 80, th = 520;
  ctx.fillStyle='#18191C'; ctx.fillRect(tx,ty,tw,th);
  ctx.strokeStyle='#3C4043'; ctx.lineWidth=2; ctx.strokeRect(tx,ty,tw,th);
  
  // Table Headers
  ctx.fillStyle=G.dim; ctx.font='9px '+F_PIXEL;
  ctx.textAlign='left';
  ctx.fillText('RANK', tx+20, ty+35);
  ctx.fillText('NAME', tx+95, ty+35);
  ctx.fillText('SCORE', tx+200, ty+35);
  ctx.fillText('DATACENTER', tx+335, ty+35);
  
  // Divider
  ctx.fillStyle='#3C4043'; ctx.fillRect(tx+15, ty+45, tw-30, 2);
  
  // Entries
  if (leaderboardLoading) {
    ctx.fillStyle=G.yellow; ctx.font='13px '+F_PIXEL; ctx.textAlign='center';
    ctx.fillText('CONNECTING TO CLOUD...', CW/2, ty+240);
  } else if (!leaderboardData || leaderboardData.length === 0) {
    ctx.fillStyle=G.dim; ctx.font='13px '+F_PIXEL; ctx.textAlign='center';
    ctx.fillText('NO SCORES RECORDED YET', CW/2, ty+240);
  } else {
    leaderboardData.slice(0, 10).forEach((entry, idx) => {
      const rowY = ty + 78 + idx * 42;
      const rank = idx + 1;
      
      let rankColor = G.text;
      let badge = `${rank}`;
      if (rank === 1) { rankColor = '#FBBC04'; badge = '1ST'; }
      else if (rank === 2) { rankColor = '#7BAAF7'; badge = '2ND'; }
      else if (rank === 3) { rankColor = '#34A853'; badge = '3RD'; }
      
      ctx.textAlign='left';
      ctx.fillStyle = rankColor; ctx.font='10px '+F_PIXEL;
      ctx.fillText(badge, tx+20, rowY);
      
      ctx.fillStyle = '#FFFFFF'; ctx.font='12px '+F_PIXEL;
      ctx.fillText(entry.name || '???', tx+95, rowY);
      
      ctx.fillStyle = G.yellow; ctx.font='12px '+F_PIXEL;
      ctx.fillText(String(entry.score || 0).padStart(7,'0'), tx+200, rowY);
      
      ctx.fillStyle = G.dim; ctx.font='18px '+F_RETRO;
      ctx.fillText(entry.region || 'us-central1', tx+335, rowY+2);
    });
  }
  
  // Footer Return Prompt
  ctx.textAlign='center';
  if (Math.floor(frame/30)%2===0) {
    ctx.fillStyle=G.yellow; ctx.font='10px '+F_PIXEL;
    ctx.fillText('PRESS [ESC] OR [ENTER] TO RETURN', CW/2, 675);
  }
  ctx.textAlign='left';
}

// ─── Update ───
function update() {
  frame++;
  if (state!==ST.PLAY) return;
  updateParticles();
  if (msgTimer>0) msgTimer--;
  if (shakeTimer>0) { shakeTimer--; shakeX=(Math.random()-0.5)*6; shakeY=(Math.random()-0.5)*6; }
  else { shakeX=0; shakeY=0; }
  if (flashTimer>0) flashTimer--;
  if (power > 80 && frame % 60 === 0) SFX.powerWarn();
  if (clearTimer>0) { clearTimer--; if(!clearTimer) finishClear(); return; }
  if (!piece) return;
  dropTimer++;
  const spd = Math.max(3, 48-(level-1)*4);
  if (dropTimer>=spd) { dropTimer=0; if(!movePiece(0,1)) { if(lockTimer<=0) lockTimer=30; } }
  if (!isValid(piece.shape,piece.x,piece.y+1)) { if(lockTimer>0){lockTimer--;if(lockTimer<=0)lockPiece();} }
  else lockTimer=0;
}

// ─── Draw frame ───
function draw() {
  ctx.fillStyle=G.bg; ctx.fillRect(0,0,CW,CH);
  switch(state) {
    case ST.MENU: drawTitle(); break;
    case ST.PLAY:
      ctx.save(); ctx.translate(shakeX, shakeY);
      drawHeader(); drawPowerBar(); drawBoard(); drawPiece(); drawParticles(); drawMsg(); drawSidebar();
      ctx.restore();
      drawFlash();
      break;
    case ST.PAUSE:
      drawHeader(); drawPowerBar(); drawBoard(); drawSidebar(); drawPause(); break;
    case ST.OVER:
      drawHeader(); drawBoard(); drawParticles(); drawSidebar(); drawOver(); break;
    case ST.NAME_ENTRY:
      drawNameEntry(); break;
    case ST.LEADERBOARD:
      drawLeaderboard(); break;
  }
}

// ─── Input ───
document.addEventListener('keydown', e => {
  if (state===ST.MENU) {
    if(e.key==='Enter'){ startGame(); e.preventDefault(); }
    else if(e.key==='l'||e.key==='L'){
      prevState = ST.MENU;
      state = ST.LEADERBOARD;
      loadLeaderboard();
      e.preventDefault();
    }
    return;
  }
  
  if (state===ST.LEADERBOARD) {
    if(e.key==='Escape' || e.key==='Enter' || e.key==='l' || e.key==='L'|| e.key===' '){
      state = prevState || ST.MENU;
      e.preventDefault();
    }
    return;
  }
  
  if (state===ST.OVER) {
    if(e.key==='Enter' || e.key===' '){
      if (score > 0) {
        state = ST.NAME_ENTRY;
        nameCursor = 0;
      } else {
        state = ST.MENU;
      }
      e.preventDefault();
    } else if(e.key==='l' || e.key==='L'){
      prevState = ST.OVER;
      state = ST.LEADERBOARD;
      loadLeaderboard();
      e.preventDefault();
    } else if(e.key==='Escape'){
      state = ST.MENU;
      e.preventDefault();
    }
    return;
  }
  
  if (state===ST.NAME_ENTRY) {
    if (e.key==='ArrowLeft') {
      nameCursor = (nameCursor + 2) % 3;
      SFX.charSelect();
      e.preventDefault();
    } else if (e.key==='ArrowRight') {
      nameCursor = (nameCursor + 1) % 3;
      SFX.charSelect();
      e.preventDefault();
    } else if (e.key==='ArrowUp') {
      let idx = LETTERS.indexOf(nameChars[nameCursor]);
      idx = (idx + 1) % LETTERS.length;
      nameChars[nameCursor] = LETTERS[idx];
      SFX.charSelect();
      e.preventDefault();
    } else if (e.key==='ArrowDown') {
      let idx = LETTERS.indexOf(nameChars[nameCursor]);
      idx = (idx - 1 + LETTERS.length) % LETTERS.length;
      nameChars[nameCursor] = LETTERS[idx];
      SFX.charSelect();
      e.preventDefault();
    } else if (e.key.length === 1 && LETTERS.includes(e.key.toUpperCase())) {
      nameChars[nameCursor] = e.key.toUpperCase();
      nameCursor = Math.min(2, nameCursor + 1);
      SFX.charSelect();
      e.preventDefault();
    } else if (e.key==='Enter' || e.key===' ') {
      const finalName = nameChars.join('');
      SFX.submit();
      recordScore(finalName, score, REGIONS[Math.min(level-1,9)]);
      prevState = ST.MENU;
      state = ST.LEADERBOARD;
      loadLeaderboard();
      e.preventDefault();
    }
    return;
  }
  
  if (state===ST.PAUSE) {
    if(e.key==='p'||e.key==='P') state=ST.PLAY;
    else if(e.key==='q'||e.key==='Q') state=ST.MENU;
    else if(e.key==='l'||e.key==='L') {
      prevState = ST.PAUSE;
      state = ST.LEADERBOARD;
      loadLeaderboard();
    }
    return;
  }
  
  if (state===ST.PLAY && clearTimer<=0) {
    switch(e.key) {
      case 'ArrowLeft': movePiece(-1,0); break;
      case 'ArrowRight': movePiece(1,0); break;
      case 'ArrowDown': softDrop(); break;
      case 'ArrowUp': rotatePiece(); break;
      case ' ': hardDrop(); break;
      case 'c': case 'C': doHold(); break;
      case 'p': case 'P': state=ST.PAUSE; break;
      case 'l': case 'L':
        prevState = ST.PLAY;
        state = ST.LEADERBOARD;
        loadLeaderboard();
        break;
    }
  }
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});

document.addEventListener('visibilitychange', ()=>{ if(document.hidden && state===ST.PLAY) state=ST.PAUSE; });

// Initial Leaderboard pre-load
loadLeaderboard();

// ─── Loop ───
frame = 0;
(function loop() { update(); draw(); requestAnimationFrame(loop); })();
</script>
